name: Kumo Independent Operations Validation
on:
  push:
    branches: [kumo-full-pipeline-upgrade]
    paths:
      - 'Kumo-Tabular-Independent-MAX/operations.py'
      - 'Kumo-Tabular-Independent-MAX/tests/test_operations.py'
      - '.github/workflows/kumo-operations.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * 1'
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Kumo-Tabular-Independent-MAX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy
      - run: python -m unittest discover -s tests -p 'test_operations.py' -v
      - name: Exercise ingest and integrity manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('ops_fixture.csv').write_text('time,target,x\n1,0,1\n2,1,2\n')
          PY
          python operations.py ingest --source ops_fixture.csv --out ops_imported.csv
          python operations.py manifest --files ops_imported.csv --out ops_manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kumo-operations-manifest
          path: Kumo-Tabular-Independent-MAX/ops_manifest.json
          if-no-files-found: warn
