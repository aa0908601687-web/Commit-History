name: LineShine HPC readiness (offline)
on:
  workflow_dispatch:
  push:
    paths:
      - 'WP-OS-Git-MAX/lineshine_adapter.py'
      - 'WP-OS-Git-MAX/test_lineshine_adapter.py'
      - '.github/workflows/lineshine-hpc-readiness.yml'
permissions:
  contents: read
jobs:
  offline-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run readiness tests (no remote job)
        run: |
          python -m py_compile WP-OS-Git-MAX/lineshine_adapter.py
          python -m unittest discover -s WP-OS-Git-MAX -p 'test_lineshine_adapter.py' -v
      - name: Record unconnected status
        run: |
          python WP-OS-Git-MAX/lineshine_adapter.py --output lineshine-readiness.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('lineshine-readiness.json').read_text())
          assert report['remote_connected'] is False
          assert report['job_submitted'] is False
          assert report['execution_verified'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lineshine-readiness
          path: lineshine-readiness.json
