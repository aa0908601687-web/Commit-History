name: Kumo Tabular Independent CI
on:
  push:
    branches: [kumo-tabular-setup]
    paths:
      - 'Kumo-Tabular-Independent-MAX/**'
      - '.github/workflows/kumo-tabular-independent.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: Kumo-Tabular-Independent-MAX
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m compileall -q verify_install.py smoke_predict.py full_pipeline_e2e.py full_scope_audit.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
  install:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install local SDK
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Verify imports and SDK
        run: python verify_install.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: kumo-install-report
          path: Kumo-Tabular-Independent-MAX/installation_check.json
          if-no-files-found: ignore
  e2e:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run real model inference smoke
        run: python smoke_predict.py
      - name: Validate inference report
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          report = json.loads(Path('prediction_smoke_report.json').read_text())
          assert report.get('success') is True
          assert report.get('predictions') == 269, 'Expected 269 held-out breast-cancer rows'
          assert isinstance(report.get('timestamp_utc'), str) and report['timestamp_utc'], 'Missing inference timestamp'
          assert isinstance(report.get('predictions'), int) and report['predictions'] > 0
          assert isinstance(report.get('accuracy'), (float, int)) and math.isfinite(report['accuracy'])
          assert 0 <= report['accuracy'] <= 1
          assert report.get('device') in ('cpu', 'cuda')
          print('Inference report validated:', report)
          PY
      - name: Execute chronological Kumo research pipeline E2E
        run: python full_pipeline_e2e.py
      - name: Validate chronological research E2E report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("research_pipeline_report.json").read_text())
          assert x["passed"] is True
          assert x["mode"] == "real_kumo_inference_synthetic_chronological_demo"
          assert len(x["walk_forward_folds"]) == 3
          assert all(f["last_train_timestamp"] < f["first_test_timestamp"] for f in x["walk_forward_folds"])
          assert all(f["test_rows"] == 10 for f in x["walk_forward_folds"])
          print("Research pipeline chrono E2E validated")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: kumo-research-pipeline-report
          path: Kumo-Tabular-Independent-MAX/research_pipeline_report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: kumo-inference-report
          path: Kumo-Tabular-Independent-MAX/prediction_smoke_report.json
          if-no-files-found: error

  scope-audit:
    needs: [unit, install, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Audit all 15 research pipeline stages (including gaps)
        run: python full_scope_audit.py
      - name: Upload full-scope evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: kumo-full-scope-audit
          path: Kumo-Tabular-Independent-MAX/full_scope_audit_report.json
          if-no-files-found: error
