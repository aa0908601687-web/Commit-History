name: Official lottery import unit tests
on:
  push:
    paths:
      - 'official_lottery_import/**'
      - '.github/workflows/official-lottery-import.yml'
  pull_request:
    paths:
      - 'official_lottery_import/**'
      - '.github/workflows/official-lottery-import.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s official_lottery_import -p 'test_*.py' -v
