name: WP-OS Adaptive Bayesian Ensemble MAX
on:
  workflow_dispatch:
    inputs:
      run_full_neural:
        description: 'Opt in to real 4-model inference (large CPU downloads; may timeout)'
        required: false
        type: boolean
        default: false
      train_lstm_gru:
        description: 'Train local LSTM/GRU with PyTorch (research only)'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'WP-OS-Git-MAX/adaptive_bayesian_ensemble_max.py'
      - 'WP-OS-Git-MAX/test_adaptive_bayesian_ensemble_max.py'
      - 'WP-OS-Git-MAX/abe_ultra_hybrid_max.json'
      - 'WP-OS-Git-MAX/test_abe_ultra_hybrid_config.py'
      - 'WP-OS-Git-MAX/abe_ultra_hybrid_max.py'
      - 'WP-OS-Git-MAX/abe_score_adapters.py'
      - 'WP-OS-Git-MAX/test_abe_score_adapters.py'
      - 'WP-OS-Git-MAX/test_abe_e2e.py'
      - 'WP-OS-Git-MAX/abe_model_connectivity.py'
      - 'WP-OS-Git-MAX/abe_train_lstm_gru.py'
      - 'WP-OS-Git-MAX/abe_partial_neural_bridge.py'
      - 'WP-OS-Git-MAX/abe_infer_foundation_models.py'
      - 'WP-OS-Git-MAX/abe_merge_real_models.py'
      - 'WP-OS-Git-MAX/test_abe_merge_real_models.py'
      - 'WP-OS-Git-MAX/test_abe_foundation_contract.py'
      - 'WP-OS-Git-MAX/test_abe_model_connectivity.py'
      - 'WP-OS-Git-MAX/historical_latest_20.csv'
      - 'WP-OS-Git-MAX/test_abe_ultra_hybrid_runtime.py'
      - '.github/workflows/wp-os-adaptive-ensemble.yml'
permissions:
  contents: read
jobs:
  adaptive-ensemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify checked-in history and 20-draw feature window
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          folder=Path('WP-OS-Git-MAX')
          def read(name):
              with (folder/name).open(encoding='utf-8-sig',newline='') as f:
                  return list(csv.DictReader(f))
          all_rows=read('historical_archive.csv')
          recent=read('historical_latest_20.csv')
          assert len(all_rows)>=20 and len(recent)==20, 'Expected valid 20-draw feature window'
          assert recent==all_rows[-20:], 'Feature-window CSV differs from full archive tail'
          ids=[r['draw_id'] for r in all_rows]
          assert len(ids)==len(set(ids)), 'Duplicate draw IDs in archive'
          print('Archive/20-draw alignment checked:',len(all_rows),'draws through',ids[-1])
          print('Repository data freshness relative to official draws NOT verified')
          PY
      - name: Compile all ABE model bridge modules
        run: |
          python -m py_compile \
            WP-OS-Git-MAX/adaptive_bayesian_ensemble_max.py \
            WP-OS-Git-MAX/abe_ultra_hybrid_max.py \
            WP-OS-Git-MAX/abe_train_lstm_gru.py \
            WP-OS-Git-MAX/abe_partial_neural_bridge.py \
            WP-OS-Git-MAX/abe_infer_foundation_models.py \
            WP-OS-Git-MAX/abe_merge_real_models.py \
            WP-OS-Git-MAX/abe_score_adapters.py
      - name: Test model registry connectivity probe without network
        run: python -m unittest discover -s WP-OS-Git-MAX -p 'test_abe_model_connectivity.py' -v
      - name: Live Chronos-2 and t0-gamma registry connection test
        continue-on-error: true
        run: python WP-OS-Git-MAX/abe_model_connectivity.py --output /tmp/wp-os-abe-model-registry.json
      - name: Install PyTorch when local neural training requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.train_lstm_gru }}
        run: python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train real LSTM and GRU (partial ensemble only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.train_lstm_gru }}
        run: |
          python WP-OS-Git-MAX/abe_train_lstm_gru.py --csv WP-OS-Git-MAX/historical_archive.csv --epochs 5 --output /tmp/wp-os-abe-lstm-gru-scores.json
          python - <<'PY'
          import json
          from pathlib import Path
          output = json.loads(Path('/tmp/wp-os-abe-lstm-gru-scores.json').read_text(encoding='utf-8'))
          assert set(output['models']) == {'lstm','gru'}
          assert output['five_model_fusion_executed'] is False
          assert output['training_samples'] > 0
          print('Local trained LSTM/GRU scores verified (NOT a complete five-model fusion)')
          PY
      - name: Connect trained LSTM and GRU to ABE partial fusion
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.train_lstm_gru }}
        run: |
          python WP-OS-Git-MAX/abe_partial_neural_bridge.py --csv WP-OS-Git-MAX/historical_archive.csv --trained-scores /tmp/wp-os-abe-lstm-gru-scores.json --output /tmp/wp-os-abe-partial-neural.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/wp-os-abe-partial-neural.json').read_text(encoding='utf-8'))
          assert result['execution_mode']=='abe_lstm_gru_partial_with_uniform_reserve'
          assert result['full_five_model_fusion_executed'] is False
          assert set(result['not_executed']) == {'chronos_2','t0_gamma'}
          assert len(result['first']) == 6 and 1 <= result['second'] <= 8
          print('Partially trained ABE+LSTM+GRU fusion output checked')
          PY
      - name: Validate foundation model input and output contracts
        run: python -m unittest discover -s WP-OS-Git-MAX -p 'test_abe_foundation_contract.py' -v
      - name: Test strict real-model merge contract (no model downloads)
        run: python -m unittest discover -s WP-OS-Git-MAX -p 'test_abe_merge_real_models.py' -v
      - name: Install runtimes for opt-in full neural inference
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_neural }}
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check chronos-forecasting "tfc-t0[torch]>=0.6.0"
      - name: Prepare bounded consistent history for neural end-to-end run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_neural }}
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          source = Path('WP-OS-Git-MAX/historical_archive.csv')
          with source.open(encoding='utf-8-sig',newline='') as stream:
              rows=list(csv.DictReader(stream))
          if len(rows)<25:
              raise ValueError('At least 25 real historical draws required')
          recent=rows[-70:]
          destination=Path('/tmp/wp-os-abe-neural-input.csv')
          with destination.open('w',encoding='utf-8',newline='') as out:
              writer=csv.DictWriter(out,fieldnames=['draw_id','first','second'])
              writer.writeheader()
              writer.writerows(recent)
          print('Bounded history:',len(recent),'ending',recent[-1]['draw_id'])
          print('This is a runtime smoke test, not complete historical validation.')
          PY
      - name: Real LSTM GRU Chronos-2 t0-gamma inference and ABE fusion
        id: real_five_model_e2e
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_neural }}
        run: |
          python WP-OS-Git-MAX/abe_train_lstm_gru.py --csv /tmp/wp-os-abe-neural-input.csv --output /tmp/wp-os-abe-real-rnn.json
          python WP-OS-Git-MAX/abe_infer_foundation_models.py --csv /tmp/wp-os-abe-neural-input.csv --output /tmp/wp-os-abe-real-foundation.json
          python WP-OS-Git-MAX/abe_merge_real_models.py --recurrent /tmp/wp-os-abe-real-rnn.json --foundation /tmp/wp-os-abe-real-foundation.json --output /tmp/wp-os-abe-four-real-scores.json
          python WP-OS-Git-MAX/abe_ultra_hybrid_max.py --csv /tmp/wp-os-abe-neural-input.csv --model-scores /tmp/wp-os-abe-four-real-scores.json > /tmp/wp-os-abe-real-fusion.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/wp-os-abe-real-fusion.json').read_text(encoding='utf-8'))
          from csv import DictReader
          p=Path('/tmp/wp-os-abe-neural-input.csv')
          with p.open(encoding='utf-8-sig',newline='') as fh:
              cutoff=list(DictReader(fh))[-1]['draw_id']
          source=json.loads(Path('/tmp/wp-os-abe-four-real-scores.json').read_text(encoding='utf-8'))
          assert source['through_draw'] == cutoff == a['through_draw'], 'Cutoff mismatch'
          assert set(source['models']) == {'lstm','gru','chronos_2','t0_gamma'}
          assert source['input_provenance'] == {'lstm_gru': 'trained_local_lstm_gru_only', 'foundation': 'real_pretrained_inference'}, 'Real model provenance missing'
          assert a['external_score_tables_validated']
          assert a['five_model_scores_fused']
          assert a['full_five_model_fusion_executed'] is False
          assert len(a['first']) == len(set(a['first'])) == 6
          assert all(1 <= n <= 38 for n in a['first'])
          assert 1 <= a['second'] <= 8
          print('Four real model tables connected and output validated at cutoff',cutoff)
          print('Actual run provenance is in job logs; statistical advantage not established')
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Real-model end-to-end validation\n')
              summary.write(f'- Cutoff: `{cutoff}`\n- LSTM + GRU: trained locally\n- Chronos-2 + t0-gamma: pretrained inference outputs merged\n- Four score tables: validated and fused with ABE\n')
              summary.write('- This is a runtime smoke test, NOT an out-of-sample accuracy validation.\n')
          PY
      - name: Report whether full neural validation was requested
        if: ${{ always() }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.run_full_neural }}" != "true" ]; then
            echo "Full five-model inference NOT run: run_full_neural was not enabled" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Full five-model inference step conclusion: ${{ steps.real_five_model_e2e.conclusion }}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Test adaptive research model
        run: python -m unittest discover -s WP-OS-Git-MAX -p 'test_adaptive_bayesian_ensemble_max.py' -v
      - name: Validate proposed five-model configuration (not model inference)
        run: python -m unittest discover -s WP-OS-Git-MAX -p 'test_abe_ultra_hybrid_config.py' -v
      - name: Test executable ABE-only fallback and provenance
        run: python -m unittest discover -s WP-OS-Git-MAX -p 'test_abe_ultra_hybrid_runtime.py' -v
      - name: Validate external model adapter contract
        run: python -m unittest discover -s WP-OS-Git-MAX -p 'test_abe_score_adapters.py' -v
      - name: End-to-end CSV, ABE fallback, synthetic four-model fusion
        run: python -m unittest discover -s WP-OS-Git-MAX -p 'test_abe_e2e.py' -v
      - name: Detect external model score secret availability
        env:
          ABE_MODEL_SCORES_JSON: ${{ secrets.ABE_MODEL_SCORES_JSON }}
        run: |
          if [ -n "$ABE_MODEL_SCORES_JSON" ]; then
            echo "HAS_ABE_SCORES=true" >> "$GITHUB_ENV"
            echo "External score input provided (contents hidden)"
          else
            echo "HAS_ABE_SCORES=false" >> "$GITHUB_ENV"
            echo "No external scores supplied: only fallback/synthetic wiring tested"
          fi
      - name: Connect supplied external model scores to ABE fusion
        if: ${{ env.HAS_ABE_SCORES == 'true' }}
        env:
          ABE_MODEL_SCORES_JSON: ${{ secrets.ABE_MODEL_SCORES_JSON }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          from csv import DictReader
          source = pathlib.Path('WP-OS-Git-MAX/historical_latest_20.csv')
          with source.open(encoding='utf-8-sig', newline='') as f:
              cutoff = list(DictReader(f))[-1]['draw_id']
          raw = os.environ['ABE_MODEL_SCORES_JSON']
          data = json.loads(raw)
          if data.get('through_draw') != cutoff:
              raise ValueError('Secret model scores do not match latest bundled draw cutoff')
          path = pathlib.Path('/tmp/wp-os-abe-external-scores.json')
          path.write_text(raw, encoding='utf-8')
          cmd = [sys.executable, 'WP-OS-Git-MAX/abe_ultra_hybrid_max.py',
                 '--csv', str(source), '--model-scores', str(path)]
          with pathlib.Path('/tmp/wp-os-abe-external-fusion.json').open('w',encoding='utf-8') as out:
              subprocess.run(cmd,stdout=out,check=True)
          report = json.loads(pathlib.Path('/tmp/wp-os-abe-external-fusion.json').read_text(encoding='utf-8'))
          assert report['five_model_scores_fused']
          assert report['external_score_tables_validated']
          assert not report['neural_inference_verified']
          print('External scores connected; inference provenance remains unverified')
          PY
      - name: Verify external score CLI connection with synthetic inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from subprocess import run
          from sys import executable
          from csv import DictReader
          source = Path('WP-OS-Git-MAX/historical_latest_20.csv')
          with source.open(encoding='utf-8-sig', newline='') as stream:
              cutoff = list(DictReader(stream))[-1]['draw_id']
          # These are synthetic test scores, NOT outputs of four neural models.
          names = ('lstm','gru','chronos_2','t0_gamma')
          zones = {
              'first': {str(i): 1.0 for i in range(1,39)},
              'second': {str(i): 1.0 for i in range(1,9)}
          }
          test_scores = {'through_draw':cutoff,
                         'models':{name:zones for name in names}}
          Path('/tmp/wp-os-abe-synthetic-scores.json').write_text(
              json.dumps(test_scores),encoding='utf-8')
          cmd = [executable,'WP-OS-Git-MAX/abe_ultra_hybrid_max.py',
                 '--csv',str(source),
                 '--model-scores','/tmp/wp-os-abe-synthetic-scores.json']
          with Path('/tmp/wp-os-abe-synthetic-fusion.json').open('w',encoding='utf-8') as out:
              run(cmd,stdout=out,check=True)
          result = json.loads(Path('/tmp/wp-os-abe-synthetic-fusion.json').read_text(encoding='utf-8'))
          assert result['execution_mode'] == 'five_model_external_scores'
          assert result['five_model_scores_fused'] is True
          assert result['external_score_tables_validated'] is True
          assert result['neural_inference_verified'] is False
          assert result['full_five_model_fusion_executed'] is False
          assert set(result['unavailable_models']) == set(names)
          print('External scores CLI transport verified using synthetic inputs only')
          PY
      - name: Execute 20-draw ABE hybrid CLI and validate JSON artifact
        run: |
          python WP-OS-Git-MAX/abe_ultra_hybrid_max.py --csv WP-OS-Git-MAX/historical_latest_20.csv > /tmp/wp-os-abe-20draw-e2e.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/wp-os-abe-20draw-e2e.json').read_text(encoding='utf-8'))
          assert report['execution_mode'] == 'abe_only_fallback'
          assert report['full_five_model_fusion_executed'] is False
          assert report['feature_window_draws'] == 20
          assert report['source_draw_count'] == 20
          assert len(report['first']) == len(set(report['first'])) == 6
          assert all(1 <= n <= 38 for n in report['first'])
          assert 1 <= report['second'] <= 8
          assert len(report['full_input_sha256']) == 64
          assert len(report['feature_window_sha256']) == 64
          import hashlib
          expected = report.pop('sha256')
          actual = hashlib.sha256(json.dumps(report, ensure_ascii=False, sort_keys=True).encode('utf-8')).hexdigest()
          assert expected == actual, 'ABE report SHA-256 mismatch'
          assert report['full_input_sha256'] == report['feature_window_sha256'], '20-draw digest mismatch'
          assert report['input_hash_timestamp_proof'] is False
          assert not report.get('five_model_scores_fused', False)
          print('20-draw CLI end-to-end fallback passed; no neural inference claimed')
          PY
      - name: Independent fourth-model prediction and backtest
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          import pathlib
          import subprocess
          import sys
          source = pathlib.Path('WP-OS-Git-MAX/historical_archive.csv')
          if not source.exists():
              print('No historical archive; prediction skipped')
              sys.exit(0)
          with source.open(encoding='utf-8-sig', newline='') as f:
              n = sum(1 for _ in csv.DictReader(f))
          print('Completed draws:', n)
          if n < 20:
              print('Fourth model requires at least 20 prior draws; skipped')
              sys.exit(0)
          cmd = [sys.executable, 'WP-OS-Git-MAX/adaptive_bayesian_ensemble_max.py', '--csv', str(source)]
          with open('/tmp/wp-os-adaptive-prediction.json','w',encoding='utf-8') as out:
              subprocess.run(cmd,check=True,stdout=out)
          if n > 20:
              # Bound the outer evaluation horizon. Each prediction may still fit
              # adaptive weights using all prior available archive rows.
              import tempfile
              with source.open(encoding='utf-8-sig', newline='') as f:
                  rows = list(csv.DictReader(f))
              # A 20-draw warmup plus at most 50 evaluation targets.
              # Earlier archive history is intentionally excluded from this
              # bounded smoke test; this is NOT a full-history backtest.
              recent = rows[-70:]
              with tempfile.NamedTemporaryFile(mode='w', suffix='.csv', encoding='utf-8', newline='', delete=False) as f:
                  writer = csv.DictWriter(f, fieldnames=['draw_id','first','second'])
                  writer.writeheader()
                  writer.writerows(recent)
                  bounded_path = f.name
              with open('/tmp/wp-os-adaptive-backtest.json','w',encoding='utf-8') as out:
                  subprocess.run([*cmd[:3], bounded_path, '--backtest'], check=True, stdout=out)
              print('Bounded last-70-row backtest smoke test; not full history')
          PY
      - name: Run hybrid entry point and verify provenance
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, pathlib, subprocess, sys
          source = pathlib.Path('WP-OS-Git-MAX/historical_archive.csv')
          if not source.exists():
              print('No historical archive; hybrid report skipped')
              sys.exit(0)
          with source.open(encoding='utf-8-sig', newline='') as f:
              count = sum(1 for _ in csv.DictReader(f))
          if count < 20:
              print('Fewer than 20 completed draws; hybrid report skipped')
              sys.exit(0)
          cmd = [sys.executable, 'WP-OS-Git-MAX/abe_ultra_hybrid_max.py', '--csv', str(source)]
          with open('/tmp/wp-os-abe-hybrid.json', 'w', encoding='utf-8') as out:
              subprocess.run(cmd, check=True, stdout=out)
          report = json.loads(pathlib.Path('/tmp/wp-os-abe-hybrid.json').read_text(encoding='utf-8'))
          assert report['execution_mode'] == 'abe_only_fallback'
          assert report['full_five_model_fusion_executed'] is False
          assert set(report['unavailable_models']) == {'lstm','gru','chronos_2','t0_gamma'}
          assert len(report['first']) == 6 and len(set(report['first'])) == 6
          assert all(1 <= x <= 38 for x in report['first'])
          assert 1 <= report['second'] <= 8
          print('Hybrid ABE-only fallback output validated:', report['through_draw'])
          PY
      - name: Upload optional fourth-model reports
        uses: actions/upload-artifact@v6
        with:
          name: wp-os-adaptive-ensemble-${{ github.run_id }}
          path: |
            /tmp/wp-os-adaptive-prediction.json
            /tmp/wp-os-adaptive-backtest.json
            /tmp/wp-os-abe-hybrid.json
            /tmp/wp-os-abe-20draw-e2e.json
            /tmp/wp-os-abe-synthetic-fusion.json
            /tmp/wp-os-abe-model-registry.json
            /tmp/wp-os-abe-external-fusion.json
            /tmp/wp-os-abe-lstm-gru-scores.json
            /tmp/wp-os-abe-partial-neural.json
            /tmp/wp-os-abe-real-rnn.json
            /tmp/wp-os-abe-real-foundation.json
            /tmp/wp-os-abe-four-real-scores.json
            /tmp/wp-os-abe-real-fusion.json
          if-no-files-found: warn
          retention-days: 30
