name: V6 score stability and leakage audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate score mapping, temporal isolation and stability calculations
        run: python -m unittest discover -s WP-OS-Git-MAX -p 'test_v6_model_audit.py' -v
      - name: Validate original V6 selection integration and exact-search consistency
        run: |
          python -m unittest discover -s WP-OS-Git-MAX -p 'test_v6_exact_search.py' -v
          python -m unittest discover -s WP-OS-Git-MAX -p 'test_v6_openfe_integration.py' -v
      - name: Install LightGBM/OpenFE diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openfe lightgbm
      - name: Run strictly past-only exploratory scoring report
        run: |
          python WP-OS-Git-MAX/v6_model_audit.py --csv WP-OS-Git-MAX/historical_latest_20.csv --max-steps 3 --skip-sensitivity --output v6-model-audit.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: v6-model-audit-report
          path: v6-model-audit.json
          if-no-files-found: error
