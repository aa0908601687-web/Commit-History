name: V6 PyTorch LightGBM fusion E2E
on:
  pull_request:
    paths:
      - 'WP-OS-Git-MAX/v6_pytorch_bridge.py'
      - 'WP-OS-Git-MAX/v6_ai_qaoa_e2e.py'
      - 'WP-OS-Git-MAX/test_v6_pytorch_fusion.py'
      - '.github/workflows/v6-pytorch-fusion-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  torch-fusion-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install real CPU PyTorch, OpenFE and LightGBM
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check 'openfe==0.0.12' 'matplotlib>=3.9,<4'
      - name: Assert real PyTorch fusion contracts
        run: python -m unittest discover -s WP-OS-Git-MAX -p 'test_v6_pytorch_fusion.py' -v
      - name: Execute full OpenFE LightGBM PyTorch -> 8 pool -> exact search -> valid ticket
        run: |
          python WP-OS-Git-MAX/v6_ai_qaoa_e2e.py \
            --csv WP-OS-Git-MAX/historical_archive.csv \
            --openfe-three-views --pytorch-three-views --pytorch-weight 0.5 \
            --output /tmp/v6-pytorch-fusion-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/v6-pytorch-fusion-evidence.json').read_text())
          layer=data["openfe_feature_layer"]
          assert layer["engine"]=="OpenFE+LightGBM+PyTorch"
          assert layer["pytorch_layer"]["trained"] is True
          assert layer["fusion_weights"]=={"lightgbm":0.5,"pytorch":0.5}
          scores={int(k):v for k,v in layer["fused_scores"].items()}
          expected=sorted(scores,key=lambda n:(-scores[n],n))[:8]
          assert data["candidate_pool"]==expected
          assert len(data["first_zone"])==len(set(data["first_zone"]))==6
          assert set(data["first_zone"]).issubset(expected)
          assert all(1<=n<=38 for n in data["first_zone"])
          assert 1<=data["second_zone"]<=8
          assert set(map(int,layer["pytorch_scores"]))==set(range(1,39))
          assert data["exact_optimization_layer"]["exact_selection"]==data["first_zone"]
          print("PASS: trained PyTorch scores fused before pool and exact selection")
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: v6-pytorch-fusion-${{ github.run_id }}
          path: /tmp/v6-pytorch-fusion-evidence.json
          if-no-files-found: error
          retention-days: 30
