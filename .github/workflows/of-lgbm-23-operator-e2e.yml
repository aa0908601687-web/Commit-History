name: OF-LGBM Standalone CPU E2E (OpenFE + LightGBM)
on:
  push:
    branches:
      - main
    paths:
      - 'verification/of_lgbm_*'
      - 'verification/of_lgbm_data/**'
      - 'verification/test_of_lgbm_*'
      - 'verification/OF_LGBM_STANDALONE.md'
      - '.github/workflows/of-lgbm-23-operator-e2e.yml'
  pull_request:
    paths:
      - 'verification/of_lgbm_*'
      - 'verification/of_lgbm_data/**'
      - 'verification/test_of_lgbm_*'
      - 'verification/OF_LGBM_STANDALONE.md'
      - '.github/workflows/of-lgbm-23-operator-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  of-lgbm-standalone:
    name: OF-LGBM only / ${{ matrix.game }} / 23 ops / Python 3.11
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        game: [power, lotto, '539']
    env:
      GAME: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dedicated OpenFE and LightGBM CPU requirements
        run: python -m pip install --disable-pip-version-check -r verification/of_lgbm_requirements.txt
      - name: Check isolation and historical CSV data gates
        run: |
          python -m unittest verification/test_of_lgbm_isolation.py verification/test_of_lgbm_all_operator_e2e.py verification/test_of_lgbm_real_history_gate.py verification/test_of_lgbm_ticket_selection.py verification/test_of_lgbm_manifest_integrity.py verification/test_of_lgbm_history_completeness.py verification/test_of_lgbm_power_date_reconcile.py -v
      - name: Execute real-history 23 OpenFE operator and LightGBM E2E
        shell: bash
        run: |
          set -euo pipefail
          case "$GAME" in
            power) HIST=verification/of_lgbm_data/power_history_archive.csv ;;
            lotto) HIST=verification/of_lgbm_data/lotto_history_mirror.csv ;;
            539) HIST=verification/of_lgbm_data/539_history_mirror.csv ;;
            *) exit 2 ;;
          esac
          python verification/of_lgbm_real_history_gate.py --game "$GAME" --csv "$HIST" --output history-audit.json > history-audit.log
          python verification/of_lgbm_history_completeness.py --output history-completeness.json > history-completeness.log
          python verification/of_lgbm_all_operator_e2e.py --game "$GAME" --csv "$HIST" --output of-lgbm-evidence.json > of-lgbm-run.log
          python - <<'PY'
          import os,json
          from pathlib import Path
          a=json.loads(Path("history-audit.json").read_text())
          d=json.loads(Path("of-lgbm-evidence.json").read_text())
          game=os.environ["GAME"]
          c=json.loads(Path("history-completeness.json").read_text())
          assert not c["official_full_history_verified"] and not c["complete_to_today_verified"]
          assert c["datasets"][game]["sha256_matches_manifest"]
          assert c["datasets"]["power"]["missing_draw_dates"] == 1964
          assert a["game"]==game and a["chronological_and_legal_range_verified"]
          assert not a["record_by_record_official_provenance_verified"]
          assert a["csv_dates_consistent"]==(game!="power")
          assert d["game"]==game and not d["synthetic_data"]
          assert d["history_draws"]==a["rows"] and d["data_cutoff"]==a["last_id"]
          assert d["feature_window_lengths"]==[10,20]
          assert d["full_archive_training_anchors"]==a["rows"]-20
          assert d["openfe_23_operator_candidate_enablement"] and d["openfe_23_operator_execution_verified"]
          assert d["all_23_operator_families_passed_to_lightgbm"] and d["lightgbm_trained_and_scored"]
          assert d["three_view_weights"] is None
          assert "learned_three_view" in d["per_view_audits"]
          assert d["view_weight_policy"] == "single_lightgbm_learned_pooled_features_no_brier_selection"
          assert all(v["operator_witnesses_executed"]==23 and v["operator_families_in_model"]==23 for v in d["per_view_audits"].values())
          assert len(d["first_zone"])==(5 if game=="539" else 6)
          assert len(set(d["first_zone"]))==len(d["first_zone"])
          assert d["exact_candidates"]==(56 if game=="539" else 28)
          assert not d["official_data_verified"] and not d["out_of_sample_predictive_advantage_verified"]
          if game=="power": assert 1<=d["second_zone"]<=8
          print("PASS: real CSV, all 23 OpenFE families, three LightGBM views, exact Python selection")
          PY
      - name: Run original OF-LGBM on separately cross-checked latest available draws
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv, os
          game=os.environ["GAME"]
          sources={
            "power":("verification/of_lgbm_data/power_history_archive.csv", ["115000093","01 12 13 18 30 33","03"],"115000093"),
            "lotto":("verification/of_lgbm_data/lotto_history_mirror.csv",None,"115000106"),
            "539":("verification/of_lgbm_data/539_history_mirror.csv",["115000280","2026-11-19","02 10 23 24 37"],"115000280"),
          }
          source,appended,expected=sources[game]
          with open(source,newline="",encoding="utf-8-sig") as stream:
            reader=csv.reader(stream)
            rows=list(reader)
          assert rows[-1][0] == ("115000092" if game=="power" else "115000106" if game=="lotto" else "115000279")
          assert len(rows)=={"power":1965,"lotto":413,"539":1120}[game]
          if appended: rows.append(appended)
          assert rows[-1][0] == expected
          with open("latest-research-input.csv","w",newline="",encoding="utf-8") as stream:
            csv.writer(stream,lineterminator="\n").writerows(rows)
          print("TEMPORARY_INPUT_SOURCE="+source+"; latest="+expected+"; externally crosschecked incremental rows, NOT full official certification")
          PY
          python verification/of_lgbm_real_history_gate.py --game "$GAME" --csv latest-research-input.csv --output latest-audit.json > latest-audit.log
          python verification/of_lgbm_all_operator_e2e.py --game "$GAME" --csv latest-research-input.csv --output latest-model.json > latest-model.log
          python - <<'PY'
          import json,os
          from pathlib import Path
          g=os.environ["GAME"]
          d=json.loads(Path("latest-model.json").read_text())
          a=json.loads(Path("latest-audit.json").read_text())
          assert not d["synthetic_data"] and d["lightgbm_trained_and_scored"]
          assert d["data_cutoff"]==a["last_id"]
          assert d["data_cutoff"]=={"power":"115000093","lotto":"115000106","539":"115000280"}[g]
          assert not d["official_data_verified"] and not d["out_of_sample_predictive_advantage_verified"]
          print("OF_LGBM_LATEST_ACTUAL_JSON="+json.dumps({
            "game":g,"first_zone":d["first_zone"],"second_zone":d["second_zone"],
            "cutoff":d["data_cutoff"],"history_draws":d["history_draws"],
            "input_sha256":d["data_sha256"],"operator_families":d["per_view_audits"]["learned_three_view"]["operator_families_in_model"],
            "exact_candidates":d["exact_candidates"],"model_trained":d["lightgbm_trained_and_scored"],
            "official_data_verified":False,"predictive_advantage_verified":False},ensure_ascii=False,sort_keys=True))
          PY
      - name: Upload latest-draw research output (not official-certified)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: of-lgbm-latest-research-${{ matrix.game }}-${{ github.run_id }}
          path: |
            latest-audit.json
            latest-model.json
            latest-audit.log
            latest-model.log
          if-no-files-found: warn
      - name: Upload genuine standalone E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: of-lgbm-standalone-${{ matrix.game }}-${{ github.run_id }}
          path: |
            history-completeness.json
            history-completeness.log
            history-audit.json
            history-audit.log
            of-lgbm-evidence.json
            of-lgbm-run.log
          if-no-files-found: warn
