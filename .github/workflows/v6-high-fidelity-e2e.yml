name: V6 local high-fidelity E2E verification

on:
  pull_request:
    paths:
      - 'WP-OS-Git-MAX/v6_ai_qaoa_e2e.py'
      - 'WP-OS-Git-MAX/v6_high_fidelity_simulator.py'
      - 'WP-OS-Git-MAX/test_v6_high_fidelity_simulator.py'
      - '.github/workflows/v6-high-fidelity-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-high-fidelity-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Unit and integration tests
        run: python -m unittest WP-OS-Git-MAX/test_v6_high_fidelity_simulator.py WP-OS-Git-MAX/test_v6_ai_qaoa_e2e.py -v
      - name: Execute local high-fidelity pipeline
        run: |
          python WP-OS-Git-MAX/v6_ai_qaoa_e2e.py \
            --csv WP-OS-Git-MAX/historical_archive.csv \
            --high-fidelity-verify \
            --output /tmp/v6-high-fidelity-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/v6-high-fidelity-evidence.json').read_text())
          layer=data['high_fidelity_layer']
          assert layer['enabled'] is True
          assert layer['minimum_observed_fidelity'] >= layer['threshold']
          assert layer['qpu'] is False
          assert layer['jupiter_nvidia_connected'] is False
          assert len(data['first_zone']) == 6
          assert 1 <= data['second_zone'] <= 8
          print('Local numerical high-fidelity layer verified; no QPU/JUPITER claim')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: v6-local-high-fidelity-evidence-${{ github.run_id }}
          path: /tmp/v6-high-fidelity-evidence.json
          if-no-files-found: error
          retention-days: 30
