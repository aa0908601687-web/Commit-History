name: OpenFE Three Lottery Installation Diagnostics
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/openfe-three-lottery-install-e2e.yml'
      - 'verification/of_lgbm_**'
      - 'verification/of_lgbm_data/**'
      - 'verification/test_of_lgbm_**'
permissions:
  contents: read
jobs:
  install-and-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        game: [power, lotto, '539']
        python-version: ['3.11']
    env:
      GAME: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OF-LGBM CPU dependencies
        run: python -m pip install --disable-pip-version-check -r verification/of_lgbm_requirements.txt
      - name: Verify installation
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import openfe, lightgbm, numpy, pandas, scipy, matplotlib, pyarrow
          from openfe import OpenFE
          assert version("openfe") == "0.0.12"
          assert callable(OpenFE)
          print("PASS: OpenFE and LightGBM CPU dependencies")
          PY
      - name: Run OF-LGBM integration unit tests
        run: |
          python -m unittest verification/test_of_lgbm_isolation.py verification/test_of_lgbm_all_operator_e2e.py verification/test_of_lgbm_real_history_gate.py verification/test_of_lgbm_full_history_install.py verification/test_of_lgbm_ticket_selection.py verification/test_of_lgbm_manifest_integrity.py verification/test_of_lgbm_history_completeness.py verification/test_of_lgbm_power_date_reconcile.py -v
      - name: Real-history three-view OpenFE LightGBM E2E
        shell: bash
        run: |
          set -euo pipefail
          case "$GAME" in
            power) HIST=verification/of_lgbm_data/power_history_archive.csv ;;
            lotto) HIST=verification/of_lgbm_data/lotto_history_mirror.csv ;;
            539) HIST=verification/of_lgbm_data/539_history_mirror.csv ;;
            *) exit 2 ;;
          esac
          python verification/of_lgbm_real_history_gate.py --game "$GAME" --csv "$HIST" --output history-audit.json
          python verification/of_lgbm_history_completeness.py --output history-completeness.json
          python verification/of_lgbm_all_operator_e2e.py --game "$GAME" --csv "$HIST" --output of-lgbm-evidence.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          game=os.environ["GAME"]
          audit=json.loads(Path("history-audit.json").read_text())
          comp=json.loads(Path("history-completeness.json").read_text())
          ev=json.loads(Path("of-lgbm-evidence.json").read_text())
          assert audit["game"]==game and audit["chronological_and_legal_range_verified"]
          assert comp["datasets"][game]["sha256_matches_manifest"]
          assert ev["game"]==game and ev["openfe_23_operator_execution_verified"]
          assert ev["all_23_operator_families_passed_to_lightgbm"]
          assert ev["lightgbm_trained_and_scored"]
          assert ev["feature_window_lengths"]==[10,20]
          assert ev["three_view_weights"] is None
          assert ev["view_weight_policy"]=="single_lightgbm_learned_pooled_features_no_brier_selection"
          assert ev["exact_candidates"]==(56 if game=="539" else 28)
          assert not ev["official_data_verified"]
          assert not ev["out_of_sample_predictive_advantage_verified"]
          if game=="power":
              assert comp["datasets"]["power"]["missing_draw_dates"]==1964
              assert 1<=ev["second_zone"]<=8
          print("PASS: real-history OF-LGBM E2E; official data provenance remains unverified")
          PY
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: of-lgbm-install-e2e-${{ matrix.game }}-${{ matrix.python-version }}
          path: |
            history-audit.json
            history-completeness.json
            of-lgbm-evidence.json
          if-no-files-found: warn
