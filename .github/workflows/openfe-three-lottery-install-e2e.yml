name: OpenFE Three Lottery Installation Diagnostics
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/openfe-three-lottery-install-e2e.yml'
jobs:
  install-and-smoke:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Environment
        run: |
          python --version
          python -m pip --version
          uname -a
      - name: Install OpenFE and LightGBM
        run: |
          python -m pip install --upgrade pip
          python -m pip install openfe lightgbm numpy pandas scipy
      - name: Verify OpenFE and LightGBM imports
        run: |
          python - <<'PY'
          import openfe, lightgbm, numpy, pandas, scipy
          print("OpenFE and LightGBM imports PASS")
          PY
      - name: Install dimod separately
        run: python -m pip install dimod
      - name: Verify dimod QUBO solver
        run: |
          python - <<'PY'
          import dimod
          bqm=dimod.BinaryQuadraticModel.from_qubo({('a','a'):-1,('b','b'):-1,('a','b'):2})
          result=dimod.ExactSolver().sample(bqm)
          assert len(result)>0
          print("dimod QUBO PASS")
          PY
      - name: Install CUDA-Q CPU separately
        run: python -m pip install cudaq
      - name: Verify CUDA-Q CPU
        run: |
          python - <<'PY'
          import cudaq
          cudaq.set_target("qpp-cpu")
          kernel=cudaq.make_kernel()
          q=kernel.qalloc()
          kernel.h(q)
          counts=cudaq.sample(kernel, shots_count=100)
          assert sum(counts.values())==100
          print("CUDA-Q CPU PASS")
          PY
      - name: Lottery combination legality smoke test (not full AI E2E)
        run: |
          python - <<'PY'
          from itertools import combinations
          for n,k in [(38,6),(49,6),(39,5)]:
              pool=list(range(1,k+3))
              choices=list(combinations(pool,k))
              assert len(choices)==28 if k==6 else len(choices)==56
              assert all(len(set(x))==k and all(1<=v<=n for v in x) for x in choices)
          assert 1<=1<=8
          print("Three lottery legality smoke PASS; no historical data/model integration tested")
          PY
