name: Independent Power historical-CSV OpenFE CPU E2E
on:
  pull_request:
    paths:
      - 'verification/openfe_three_lottery_integration.py'
      - '.github/workflows/independent-power-history-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-power-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real CPU tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install openfe lightgbm numpy pandas scipy matplotlib dimod cudaq
      - name: Run independent E2E on archived Power CSV
        run: |
          python verification/openfe_three_lottery_integration.py --game power --csv WP-OS-Git-MAX/historical_archive.csv > raw-run.log
          tail -n 1 raw-run.log > historical-power-e2e.json
          python - <<'PY'
          import json
          d=json.load(open('historical-power-e2e.json'))
          assert len(d)==1 and d[0]['game']=='power'
          x=d[0]
          assert x['history_draws']>=16 and x['data_cutoff'] and not x['synthetic_data']
          assert x['three_view_fusion_executed'] and x['lightgbm_trained']
          assert x['qubo_exact_agreement'] and x['cudaq_cpu_executed']
          assert x['cudaq_used_for_selection'] is False
          assert x['official_data_verified'] is False
          assert len(x['first_zone'])==6 and len(set(x['first_zone']))==6
          assert all(1<=n<=38 for n in x['first_zone'])
          assert 1<=x['second_zone']<=8 and x['exact_candidates']==28
          print('PASS: repository Power CSV model E2E; this is not official current-data certification')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-historical-power
          path: historical-power-e2e.json
          if-no-files-found: warn
