name: V6 OF3Q joint PyTorch CUDA-Q exact E2E
on:
  pull_request:
    paths:
      - 'WP-OS-Git-MAX/v6_exact_e2e.py'
      - 'WP-OS-Git-MAX/v6_pytorch_bridge.py'
      - 'WP-OS-Git-MAX/v6_openfe_bridge.py'
      - 'WP-OS-Git-MAX/v6_cudaq_backend.py'
      - 'WP-OS-Git-MAX/v6_exact_search.py'
      - '.github/workflows/v6-torch-cudaq-joint-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'WP-OS-Git-MAX/v6_exact_e2e.py'
      - 'WP-OS-Git-MAX/v6_pytorch_bridge.py'
      - 'WP-OS-Git-MAX/v6_openfe_bridge.py'
      - 'WP-OS-Git-MAX/v6_cudaq_backend.py'
      - 'WP-OS-Git-MAX/v6_exact_search.py'
      - '.github/workflows/v6-torch-cudaq-joint-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  joint-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install real PyTorch OpenFE LightGBM CUDA-Q on CPU
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check 'openfe==0.0.12' 'matplotlib>=3.9,<4' cudaq
      - name: Verify dependencies and local CUDA-Q backend
        run: |
          python - <<'PY'
          import torch, cudaq, lightgbm, openfe
          assert torch.__version__
          cudaq.set_target('qpp-cpu')
          print('CPU torch and CUDA-Q qpp-cpu available')
          PY
      - name: Execute one joint invocation with mandatory PyTorch and CUDA-Q
        run: |
          python WP-OS-Git-MAX/v6_exact_e2e.py \
            --csv WP-OS-Git-MAX/historical_archive.csv \
            --openfe-three-views --pytorch-three-views --pytorch-weight 0.5 \
            --require-cudaq \
            --output v6-joint-e2e-result.json
      - name: Assert trained fusion to identical CUDA-Q and exact pool
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          x=json.loads(Path('v6-joint-e2e-result.json').read_text())
          f=x['openfe_feature_layer']
          c=x['cudaq_layer']
          opt=x['exact_optimization_layer']
          assert f['engine']=='OpenFE+LightGBM+PyTorch'
          assert f['pytorch_layer']['trained'] is True
          assert f['fusion_weights']=={'lightgbm':0.5,'pytorch':0.5}
          p={int(k):float(v) for k,v in f['pytorch_scores'].items()}
          l={int(k):float(v) for k,v in f['lightgbm_scores'].items()}
          s={int(k):float(v) for k,v in f['fused_scores'].items()}
          assert set(p)==set(l)==set(s)==set(range(1,39))
          assert all(math.isfinite(v) and 0<=v<=1 for v in [*p.values(),*l.values(),*s.values()])
          assert all(math.isclose(s[n],0.5*p[n]+0.5*l[n],abs_tol=1e-12) for n in s)
          expected=sorted(s,key=lambda n:(-s[n],n))[:8]
          assert x['candidate_pool']==expected
          assert c['enabled'] is True and c['executed'] is True and c['backend']=='qpp-cpu'
          assert c['qpu'] is False and c['real_qpu_connected'] is False
          assert opt['searched_combinations']==28
          assert opt['globally_optimal_within_pool'] is True
          assert len(opt['approximate_selection'])==6
          assert set(opt['approximate_selection']).issubset(expected)
          assert opt['approximate_score']<=opt['exact_score']+1e-10
          assert x['first_zone']==opt['exact_selection']
          assert set(x['first_zone']).issubset(expected) and len(set(x['first_zone']))==6
          assert all(1<=n<=38 for n in x['first_zone'])
          assert 1<=x['second_zone']<=8
          print('PASS: ONE invocation train PyTorch + LightGBM -> fused 38 -> top8 -> real local CUDA-Q -> exact optimum -> valid 6+1')
          print(json.dumps({'cutoff':x['last_draw'],'pool':expected,'first_zone':x['first_zone'],'second_zone':x['second_zone'],'cudaq_approx_score':opt['approximate_score'],'exact_score':opt['exact_score'],'score_gap':opt['score_gap'],'draw_sha256':x['sha256'],'production_deployed':False},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: v6-torch-cudaq-joint-${{ github.run_id }}
          path: v6-joint-e2e-result.json
          if-no-files-found: error
          retention-days: 30
