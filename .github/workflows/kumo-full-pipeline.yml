name: Kumo Full Pipeline Baselines
on:
  push:
    branches: [kumo-full-pipeline-upgrade]
    paths:
      - 'Kumo-Tabular-Independent-MAX/**'
      - '.github/workflows/kumo-full-pipeline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Kumo-Tabular-Independent-MAX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install pandas numpy scikit-learn lightgbm
          python -m pip check
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_full_pipeline.py' -v
      - name: Generate deterministic CI fixture
        run: |
          python - <<'PY'
          from sklearn.datasets import load_breast_cancer
          df = load_breast_cancer(as_frame=True).frame
          df.insert(0, 'time', range(len(df)))
          df.to_csv('ci_fixture.csv', index=False)
          PY
      - name: Run walk-forward baseline E2E
        run: python full_pipeline.py --csv ci_fixture.csv --min-train 300 --step 50 --out pipeline_report.json
      - name: Validate report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('pipeline_report.json').read_text())
          assert len(p['source_sha256']) == 64
          assert p['splits']
          assert {'dummy','logistic','lightgbm'} <= {x['model'] for x in p['splits']}
          assert all(0 <= x['accuracy'] <= 1 for x in p['splits'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kumo-full-pipeline-baseline-report
          path: Kumo-Tabular-Independent-MAX/pipeline_report.json
          if-no-files-found: warn
