name: V6 OpenFE integration verification

on:
  pull_request:
    paths:
      - 'WP-OS-Git-MAX/v6_openfe_bridge.py'
      - 'WP-OS-Git-MAX/v6_ai_exact_e2e.py'
      - 'WP-OS-Git-MAX/test_v6_openfe_integration.py'
      - '.github/workflows/v6-openfe-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openfe-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install OpenFE and its runtime plotting dependency
        run: python -m pip install --disable-pip-version-check 'openfe==0.0.12' 'matplotlib>=3.9,<4'
      - name: Run integration contract tests
        run: python -m unittest WP-OS-Git-MAX/test_v6_openfe_integration.py -v
      - name: Execute real three-history-view OpenFE to local EXACT pipeline
        run: |
          python WP-OS-Git-MAX/v6_ai_exact_e2e.py \
            --csv WP-OS-Git-MAX/historical_archive.csv \
            --openfe-three-views \
            --output /tmp/v6-openfe-three-views-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/v6-openfe-three-views-evidence.json').read_text())
          layer=data['openfe_feature_layer']
          expected=['latest_5','latest_10','full_archive']
          assert layer['enabled'] is True
          assert layer['weight']==1.0
          assert layer['engine']=='OpenFE+LightGBM'
          assert layer['mode']=='three_history_views_100_percent'
          assert layer['history_views']==expected
          assert layer['leakage_safe'] is True
          assert layer['feature_window']==[5,10]
          assert layer['full_archive_role']=='training_anchors_only'
          assert layer['used_features'] > 0
          assert set(layer['per_view_scores'])==set(expected)
          assert all(len(layer['per_view_scores'][name])==38 for name in expected)
          assert len(data['first_zone'])==6
          assert 1 <= data['second_zone'] <= 8
          assert 'NOT QPU' in data['model']
          print('Three history views -> OpenFE/LightGBM 100% -> local EXACT verified')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: v6-openfe-three-views-evidence-${{ github.run_id }}
          path: /tmp/v6-openfe-three-views-evidence.json
          if-no-files-found: error
          retention-days: 30
