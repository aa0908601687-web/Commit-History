name: V6 OpenFE integration verification

on:
  pull_request:
    paths:
      - 'WP-OS-Git-MAX/v6_openfe_bridge.py'
      - 'WP-OS-Git-MAX/v6_ai_qaoa_e2e.py'
      - 'WP-OS-Git-MAX/test_v6_openfe_integration.py'
      - '.github/workflows/v6-openfe-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openfe-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install the machine-learning OpenFE package
        run: python -m pip install --disable-pip-version-check 'openfe==0.0.12'
      - name: Run integration contract tests
        run: python -m unittest WP-OS-Git-MAX/test_v6_openfe_integration.py -v
      - name: Execute real OpenFE to V6 to local QAOA pipeline
        run: |
          python WP-OS-Git-MAX/v6_ai_qaoa_e2e.py \
            --csv WP-OS-Git-MAX/historical_archive.csv \
            --openfe --openfe-weight 0.30 \
            --output /tmp/v6-openfe-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/v6-openfe-evidence.json').read_text())
          layer=data['openfe_feature_layer']
          assert layer['enabled'] is True
          assert layer['engine']=='OpenFE+LightGBM'
          assert layer['leakage_safe'] is True
          assert layer['used_features'] > 0
          assert len(data['first_zone'])==6
          assert 1 <= data['second_zone'] <= 8
          assert 'NOT QPU' in data['model']
          print('OpenFE -> V6 scoring -> local QAOA integration verified')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: v6-openfe-evidence-${{ github.run_id }}
          path: /tmp/v6-openfe-evidence.json
          if-no-files-found: error
          retention-days: 30
