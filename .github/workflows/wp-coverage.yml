name: WP-OS Git MAX Test Coverage

on:
  push:
    paths:
      - 'WP-OS-Git-MAX/**'
      - '.github/workflows/wp-coverage.yml'
  pull_request:
    paths:
      - 'WP-OS-Git-MAX/**'
      - '.github/workflows/wp-coverage.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *' # Daily at 08:15 Asia/Taipei (UTC+8)

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install coverage tool
        run: python -m pip install 'coverage>=7,<8'
      - name: Run tests and measure application code
        run: |
          python -m coverage run --branch --source=WP-OS-Git-MAX --omit='*/test_*.py' -m unittest discover -s WP-OS-Git-MAX -p 'test_*.py'
          python -m coverage report -m --omit='*/test_*.py' | tee coverage-summary.txt
          python -m coverage xml -o coverage.xml
          python -m coverage html -d htmlcov
          python -m coverage json -o coverage.json
          python - <<'PY'
          import json, os
          data = json.load(open('coverage.json', encoding='utf-8'))
          totals = data['totals']
          percent = totals['percent_covered']
          report = {
              'commit_sha': os.environ.get('GITHUB_SHA', ''),
              'covered_percent': percent,
              'target_percent': 100,
              'covered_statements': totals['covered_lines'],
              'total_statements': totals['num_statements'],
              'covered_branches': totals['covered_branches'],
              'total_branches': totals['num_branches'],
              'meets_target': percent >= 100
          }
          with open('coverage-status.json', 'w', encoding='utf-8') as fp:
              json.dump(report, fp, indent=2)
          print(f"Current coverage: {percent:.2f}% | Target: 100%")
          PY
          python -m coverage report --fail-under=100 --omit='*/test_*.py'
      - name: Show coverage in Actions summary
        if: always()
        run: |
          echo '## WP-OS Git MAX code coverage' >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage-status.json ]; then
            echo 'Coverage percentage and commit are recorded in coverage-status.json.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f coverage-summary.txt ]; then
            echo 'Target: 100% statement and branch coverage. Test files excluded. A lower score fails this workflow.' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Coverage report unavailable; check failed test step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-os-git-max-coverage
          path: |
            coverage-summary.txt
            coverage.xml
            coverage.json
            coverage-status.json
            htmlcov/
          if-no-files-found: warn
