name: WP-OS Git MAX Test Coverage

on:
  push:
    paths:
      - 'WP-OS-Git-MAX/**'
      - '.github/workflows/wp-coverage.yml'
  pull_request:
    paths:
      - 'WP-OS-Git-MAX/**'
      - '.github/workflows/wp-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install coverage tool
        run: python -m pip install 'coverage>=7,<8'
      - name: Run unit tests under coverage
        run: |
          python -m coverage run --source=WP-OS-Git-MAX -m unittest discover -s WP-OS-Git-MAX -p 'test_*.py'
          python -m coverage report -m
          python -m coverage xml -o coverage.xml
          python -m coverage html -d htmlcov
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-os-git-max-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
