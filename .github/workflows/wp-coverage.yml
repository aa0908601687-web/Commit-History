name: WP-OS Git MAX Test Coverage

on:
  push:
    paths:
      - 'WP-OS-Git-MAX/**'
      - '.github/workflows/wp-coverage.yml'
  pull_request:
    paths:
      - 'WP-OS-Git-MAX/**'
      - '.github/workflows/wp-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install coverage tool
        run: python -m pip install 'coverage>=7,<8'
      - name: Run tests and measure application code
        run: |
          python -m coverage run --branch --source=WP-OS-Git-MAX --omit='*/test_*.py' -m unittest discover -s WP-OS-Git-MAX -p 'test_*.py'
          python -m coverage report -m --omit='*/test_*.py' | tee coverage-summary.txt
          python -m coverage xml -o coverage.xml
          python -m coverage html -d htmlcov
      - name: Show coverage in Actions summary
        if: always()
        run: |
          echo '## WP-OS Git MAX code coverage' >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage-summary.txt ]; then
            echo 'Actual application code; test files excluded. Branch coverage enabled.' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Coverage report unavailable; check failed test step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-os-git-max-coverage
          path: |
            coverage-summary.txt
            coverage.xml
            htmlcov/
          if-no-files-found: warn
