name: V6 integration readiness (non-production)
on:
  pull_request:
    paths:
      - 'WP-OS-Git-MAX/**'
      - '.github/workflows/v6-integration-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Official API validation contract tests (no network)
        run: python -m unittest discover -s WP-OS-Git-MAX -p 'test_update_official_data.py'
      - name: Three-model historical data parity and evidence report
        run: python WP-OS-Git-MAX/v6_integration_readiness.py > v6-readiness.json
      - name: Display audit
        run: cat v6-readiness.json
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: v6-main-readiness-${{ github.run_id }}
          path: v6-readiness.json
          if-no-files-found: error
