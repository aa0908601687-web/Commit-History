name: V6 post-merge read-only E2E verification
on:
  push:
    branches:
      - validation/v6-main-e2e-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenFE and LightGBM
        run: |
          python -m pip install --upgrade pip
          python -m pip install openfe lightgbm matplotlib
      - name: Verify OpenFE and LightGBM imports
        run: |
          python - <<'PY'
          from openfe import OpenFE
          import lightgbm
          print("OpenFE + LightGBM import OK")
          print("LightGBM version:", lightgbm.__version__)
          PY
      - name: Install NVIDIA CUDA-Q CPU simulator
        run: |
          python -m pip install --upgrade pip
          python -m pip install cudaq
      - name: Verify CUDA-Q qpp-cpu simulation
        run: |
          python - <<'PY'
          import cudaq
          cudaq.set_target("qpp-cpu")
          kernel = cudaq.make_kernel()
          q = kernel.qalloc()
          kernel.x(q)
          kernel.mz(q)
          result = cudaq.sample(kernel, shots_count=100)
          assert result.count("1") == 100, str(result)
          print("CUDA-Q qpp-cpu simulation OK:", result)
          PY
      - name: Execute V6 selection with required CUDA-Q backend
        run: |
          python WP-OS-Git-MAX/v6_ai_qaoa_e2e.py --csv WP-OS-Git-MAX/historical_latest_20.csv --openfe-three-views --high-fidelity-verify --require-cudaq --output v6-cudaq-selection.json
          python - <<'PY'
          import json
          result = json.load(open("v6-cudaq-selection.json"))
          assert result["openfe_feature_layer"]["enabled"] is True
          assert result["high_fidelity_layer"]["enabled"] is True
          assert result["high_fidelity_layer"]["minimum_observed_fidelity"] >= 0.99999
          assert result["cudaq_layer"]["executed"] is True
          assert result["cudaq_layer"]["qpu"] is False
          assert len(result["first_zone"]) == 6
          assert 1 <= result["second_zone"] <= 8
          print("V6 CUDA-Q integrated selection OK")
          PY
      - name: Verify V3 feature cache refresh hit and tamper recovery
        run: |
          python - <<'PY'
          import json, pathlib, sys, tempfile
          sys.path.insert(0, "WP-OS-Git-MAX")
          from cache_and_hit_validation import load_draws
          from cache_v3_pipeline import cache_for, predict_from_cache
          from wp_os_git_max import predict
          draws = load_draws("WP-OS-Git-MAX/historical_latest_10.csv")
          with tempfile.TemporaryDirectory() as folder:
              path = pathlib.Path(folder) / "feature-cache.json"
              fresh, first = cache_for(draws, path)
              reused, second = cache_for(draws, path)
              assert (first, second) == ("refreshed", "hit")
              assert fresh == reused
              assert predict_from_cache(reused) == predict(draws)
              corrupt = json.loads(path.read_text())
              corrupt["first"]["five"][0] += 1
              path.write_text(json.dumps(corrupt))
              restored, third = cache_for(draws, path)
              assert third == "refreshed" and restored == fresh
              assert predict_from_cache(restored) == predict(draws)
              print(json.dumps({"initial": first, "repeat": second, "tamper": third, "parity": "pass", "through_draw": draws[-1]["draw_id"]}))
          PY
      - name: V3 cache gated OpenFE LightGBM CUDA-Q end-to-end comparison
        run: |
          python - <<'PY'
          import json, pathlib, sys, tempfile
          sys.path.insert(0, "WP-OS-Git-MAX")
          from cache_and_hit_validation import load_draws
          from cache_v3_pipeline import cache_for, expected
          from v6_ai_qaoa_e2e import run
          source="WP-OS-Git-MAX/historical_latest_20.csv"
          draws=load_draws(source)
          with tempfile.TemporaryDirectory() as folder:
              path=pathlib.Path(folder)/"v3.json"
              cached,initial=cache_for(draws,path)
              reused,hit=cache_for(draws,path)
              assert (initial,hit)==("refreshed","hit")
              assert cached==reused==expected(draws)
              assert cached["through_draw"]==draws[-1]["draw_id"]
              direct=run(source,openfe_three_views=True,high_fidelity_verify=True,require_cudaq=True)
              gated=run(source,openfe_three_views=True,high_fidelity_verify=True,require_cudaq=True)
              assert direct["first_zone"]==gated["first_zone"]
              assert direct["second_zone"]==gated["second_zone"]
              assert gated["openfe_feature_layer"]["enabled"] is True
              assert gated["cudaq_layer"]["executed"] is True
              print(json.dumps({"status":"pass","cache_initial":initial,"cache_repeat":hit,"cache_verified":True,"selection_parity":"pass","first_zone":gated["first_zone"],"second_zone":gated["second_zone"],"through_draw":gated["last_draw"],"scope":"cache integrity gate followed by identical V6 inference; OpenFE feature input is not yet sourced from V3 cache"}))
          PY
      - name: Three-model historical parity (offline)
        run: python WP-OS-Git-MAX/v6_integration_readiness.py > v6-readiness.json
      - name: Three-model and local QAOA comparison
        run: python WP-OS-Git-MAX/v6_three_model_qaoa_bridge.py > v6-model-qaoa.json
      - name: Official API live read-only merge and comparison
        run: python WP-OS-Git-MAX/v6_live_api_e2e_probe.py --output v6-live-api-e2e.json
      - name: Assert provenance without making production deployment claims
        run: |
          python - <<'PY'
          import json
          a=json.load(open('v6-readiness.json'))
          b=json.load(open('v6-model-qaoa.json'))
          c=json.load(open('v6-live-api-e2e.json'))
          assert a['three_model_parity']=='pass'
          assert a['data']['cutoff']==b['cutoff']
          assert c['merged_cutoff']==c['three_model_qaoa_comparison']['cutoff']
          assert c['repository_archive_modified'] is False
          assert c['trained_ai_verified'] is False
          assert c['production_main_deployed'] is False
          print(json.dumps({'offline_cutoff':a['data']['cutoff'],'live_merged_cutoff':c['merged_cutoff'],'api_rows':c['api_rows'],'new_draws':c['new_draw_count'],'status':c['status'],'production_verified':False}))
          PY
      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v6-post-merge-e2e-evidence
          path: |
            v6-cudaq-selection.json
            v6-readiness.json
            v6-model-qaoa.json
            v6-live-api-e2e.json
          if-no-files-found: error
