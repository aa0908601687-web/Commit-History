name: V6 no-cache OpenFE CUDA-Q end-to-end verification
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - validation/v6-main-e2e-20261103
      - integration/v6-cache-openfe-clean-20261104
      - change/v6-no-bayesian-no-cache-20261104
      - main
      - feature/v6-exact-search-e2e-20261105
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify cache-free V6 invocation contract
        run: |
          python - <<'PY'
          import importlib.util
          import inspect
          from pathlib import Path
          path = Path("WP-OS-Git-MAX/v6_exact_e2e.py")
          spec = importlib.util.spec_from_file_location("v6_no_cache", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert "v3_cache_path" not in inspect.signature(module.run).parameters
          assert "--v3-cache" not in path.read_text(encoding="utf-8")
          print("V6 no-cache contract OK")
          PY
          python -m unittest discover -s WP-OS-Git-MAX -p 'test_v6_openfe_integration.py' -v
      - name: Test exact-search optimizer
        run: python -m unittest discover -s WP-OS-Git-MAX -p 'test_v6_exact_search.py' -v
      - name: Install OpenFE and LightGBM
        run: |
          python -m pip install --upgrade pip
          python -m pip install openfe lightgbm matplotlib
      - name: Verify OpenFE and LightGBM imports
        run: |
          python - <<'PY'
          from openfe import OpenFE
          import lightgbm
          print("OpenFE + LightGBM import OK")
          print("LightGBM version:", lightgbm.__version__)
          PY
      - name: Install NVIDIA CUDA-Q CPU simulator
        run: |
          python -m pip install --upgrade pip
          python -m pip install cudaq
      - name: Verify CUDA-Q qpp-cpu simulation
        run: |
          python - <<'PY'
          import cudaq
          cudaq.set_target("qpp-cpu")
          kernel = cudaq.make_kernel()
          q = kernel.qalloc()
          kernel.x(q)
          kernel.mz(q)
          result = cudaq.sample(kernel, shots_count=100)
          assert result.count("1") == 100, str(result)
          print("CUDA-Q qpp-cpu simulation OK:", result)
          PY
      - name: Execute V6 selection with required CUDA-Q backend
        run: |
          python WP-OS-Git-MAX/v6_exact_e2e.py --csv WP-OS-Git-MAX/historical_latest_20.csv --openfe-three-views --high-fidelity-verify --require-cudaq --output v6-cudaq-selection.json
          python - <<'PY'
          import json
          result = json.load(open("v6-cudaq-selection.json"))
          assert result["openfe_feature_layer"]["enabled"] is True
          assert result["openfe_feature_layer"]["weight"] == 1.0
          assert result["openfe_feature_layer"]["v3_cache_features_used"] is False
          assert result["openfe_feature_layer"]["view_weights"] == {"latest_5":1/3,"latest_10":1/3,"full_archive":1/3}
          assert result["high_fidelity_layer"]["enabled"] is False
          assert "removed" in result["high_fidelity_layer"]["scope"]
          assert result["cudaq_layer"]["executed"] is True
          opt = result["exact_optimization_layer"]
          assert opt["globally_optimal_within_pool"] is True
          assert opt["score_gap"] >= 0
          assert result["first_zone"] == opt["exact_selection"]
          assert opt["searched_combinations"] == 28
          assert result["cudaq_layer"]["qpu"] is False
          assert result["openfe_feature_layer"]["mode"] == "three_history_views_100_percent"
          assert len(result["first_zone"]) == 6
          assert 1 <= result["second_zone"] <= 8
          print("V6 CUDA-Q integrated selection OK")
          PY
      - name: Independent final selection consistency audit
        run: python WP-OS-Git-MAX/v6_selection_consistency_audit.py --result v6-cudaq-selection.json --output v6-selection-consistency.json
      - name: Three-model historical parity (offline)
        run: python WP-OS-Git-MAX/v6_integration_readiness.py > v6-readiness.json
      - name: Three-model and local exact comparison
        run: python WP-OS-Git-MAX/v6_three_model_exact_bridge.py > v6-model-exact.json
      - name: Official API live read-only merge and comparison
        run: python WP-OS-Git-MAX/v6_live_api_e2e_probe.py --output v6-live-api-e2e.json --merged-csv-output v6-live-merged-verified.csv
      - name: Full V6 OpenFE CUDA-Q exact selection on verified live-merged draws
        run: |
          python WP-OS-Git-MAX/v6_exact_e2e.py --csv v6-live-merged-verified.csv --openfe-three-views --high-fidelity-verify --require-cudaq --output v6-live-full-selection.json
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          provenance=json.loads(Path("v6-live-api-e2e.json").read_text())
          selection=json.loads(Path("v6-live-full-selection.json").read_text())
          csv_path=Path("v6-live-merged-verified.csv")
          with csv_path.open(newline="",encoding="utf-8") as f:
              draws=list(csv.DictReader(f))
          assert draws and selection["last_draw"] == draws[-1]["draw_id"] == provenance["merged_cutoff"]
          assert hashlib.sha256(csv_path.read_bytes()).hexdigest() == provenance["verified_merged_sha256"] == selection["sha256"]
          assert selection["openfe_feature_layer"]["enabled"] is True
          assert selection["openfe_feature_layer"]["weight"] == 1.0
          assert selection["cudaq_layer"]["executed"] is True
          assert selection["cudaq_layer"]["qpu"] is False
          assert selection["exact_optimization_layer"]["globally_optimal_within_pool"] is True
          assert selection["first_zone"] == selection["exact_optimization_layer"]["exact_selection"]
          assert len(selection["first_zone"]) == 6 and 1 <= selection["second_zone"] <= 8
          print(json.dumps({"verified_cutoff":selection["last_draw"],"first_zone":selection["first_zone"],"second_zone":selection["second_zone"],"live_data_rows":len(draws),"production_deployed":False}))
          PY
      - name: Assert provenance without making production deployment claims
        run: |
          python - <<'PY'
          import json
          a=json.load(open('v6-readiness.json'))
          b=json.load(open('v6-model-exact.json'))
          c=json.load(open('v6-live-api-e2e.json'))
          assert a['three_model_parity']=='pass'
          assert a['data']['cutoff']==b['cutoff']
          assert c['merged_cutoff']==c['three_model_exact_comparison']['cutoff']
          assert c['repository_archive_modified'] is False
          assert c['trained_ai_verified'] is False
          assert c['production_main_deployed'] is False
          print(json.dumps({'offline_cutoff':a['data']['cutoff'],'live_merged_cutoff':c['merged_cutoff'],'api_rows':c['api_rows'],'new_draws':c['new_draw_count'],'status':c['status'],'production_verified':False}))
          PY
      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v6-post-merge-e2e-evidence
          path: |
            v6-cudaq-selection.json
            v6-selection-consistency.json
            v6-readiness.json
            v6-model-exact.json
            v6-live-api-e2e.json
            v6-live-merged-verified.csv
            v6-live-full-selection.json
          if-no-files-found: error
