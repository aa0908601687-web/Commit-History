name: WP AI Quantum IBM Real QPU Probe (Disabled Pending Zero-Cost Proof)
on:
  workflow_dispatch:
    inputs:
      authorize_qpu_cost:
        description: 'Explicitly authorize real hardware execution and possible provider charges'
        required: true
        type: boolean
        default: false
      backend:
        description: 'Optional hardware backend name (blank chooses least busy)'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  real-qpu-probe:
    # Zero-cost only policy: fail closed. Manual authorization cannot prove zero billing.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify authorization and install runtime
        run: |
          python -m pip install --disable-pip-version-check qiskit qiskit-ibm-runtime
          python -m py_compile WP-AI-Quantum/ibm_real_qpu_probe.py
          python -m unittest discover -s WP-AI-Quantum -p 'test_ibm_real_qpu_probe.py' -v
          python -m unittest discover -s WP-AI-Quantum -p 'test_ibm_provider_verify.py' -v
          python -m unittest discover -s WP-AI-Quantum -p 'test_*.py' -v
          python WP-AI-Quantum/quantum_e2e_validation.py --csv WP-OS-Git-MAX/historical_latest_20.csv > selection_preflight.json
      - name: Run actual IBM hardware (never simulator)
        env:
          IBM_QUANTUM_API_TOKEN: ${{ secrets.IBM_QUANTUM_API_TOKEN }}
          IBM_QUANTUM_INSTANCE: ${{ secrets.IBM_QUANTUM_INSTANCE }}
          QPU_BACKEND: ${{ inputs.backend }}
        run: |
          if [ -z "$IBM_QUANTUM_API_TOKEN" ] || [ -z "$IBM_QUANTUM_INSTANCE" ]; then
            echo 'No IBM Quantum credentials configured; no job attempted'
            exit 1
          fi
          if [ -n "$QPU_BACKEND" ]; then
            python WP-AI-Quantum/ibm_real_qpu_probe.py --backend "$QPU_BACKEND" --output qpu_report.json
          else
            python WP-AI-Quantum/ibm_real_qpu_probe.py --output qpu_report.json
          fi
      - name: Validate completed QPU receipt against selection interface
        run: |
          python -m unittest discover -s WP-AI-Quantum -p 'test_quantum_e2e_validation.py' -v
          python WP-AI-Quantum/quantum_e2e_validation.py --csv WP-OS-Git-MAX/historical_latest_20.csv --receipt qpu_report.json > e2e_report.json
      - name: Independently verify completed job against IBM provider
        env:
          IBM_QUANTUM_API_TOKEN: ${{ secrets.IBM_QUANTUM_API_TOKEN }}
          IBM_QUANTUM_INSTANCE: ${{ secrets.IBM_QUANTUM_INSTANCE }}
        run: |
          python WP-AI-Quantum/ibm_provider_verify.py --receipt qpu_report.json --output provider_verified.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('provider_verified.json').read_text())
          assert p['provider_provenance_independently_verified'] is True
          assert p['quantum_lottery_optimization_executed'] is False
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('IBM provider re-query verified QPU job: '+p['job_id']+' on '+p['backend']+chr(10))
              f.write('This probe is not a quantum lottery optimization.'+chr(10))
          PY
      - name: Cross-check final QPU evidence before success
        run: python WP-AI-Quantum/quantum_evidence_gate.py --selection e2e_report.json --provider provider_verified.json --output hardware_evidence.json
      - name: Publish hardware verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibm-real-qpu-verification
          path: |
            selection_preflight.json
            qpu_report.json
            e2e_report.json
            provider_verified.json
            hardware_evidence.json
          if-no-files-found: ignore
