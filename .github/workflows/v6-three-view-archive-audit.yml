name: V6 three-view archive audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/v6-semantic-release-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check 20-row fixture against canonical archive and audit dynamic boundaries
        run: |
          python - <<'PY'
          import csv
          import subprocess
          import sys
          from pathlib import Path

          root = Path("WP-OS-Git-MAX")
          with (root / "historical_archive.csv").open(encoding="utf-8-sig", newline="") as f:
              archive = list(csv.DictReader(f))
          with (root / "historical_latest_20.csv").open(encoding="utf-8-sig", newline="") as f:
              fixture = list(csv.DictReader(f))
          assert len(archive) >= 20, "Canonical archive has fewer than 20 rows"
          assert len(fixture) == 20, "Expected exactly 20 fixture rows"
          assert fixture == archive[-20:], "20-row fixture differs from canonical archive suffix"
          expected_first = archive[-20]["draw_id"]
          expected_last = archive[-1]["draw_id"]
          subprocess.run([
              sys.executable, str(root / "v6_three_view_archive_audit.py"),
              "--csv", str(root / "historical_latest_20.csv"),
              "--expected-first-draw", expected_first,
              "--expected-last-draw", expected_last,
              "--expected-count", "20",
              "--output", "v6-three-view-audit.json",
          ], check=True)
          print("PASS: dynamic boundaries, canonical archive suffix and number validation")
          PY
      - name: Reject false full-history assertion
        run: |
          python - <<'PY'
          import csv
          import subprocess
          import sys
          from pathlib import Path

          root = Path("WP-OS-Git-MAX")
          with (root / "historical_archive.csv").open(encoding="utf-8-sig", newline="") as f:
              archive = list(csv.DictReader(f))
          assert len(archive) > 20, "Expected canonical archive to exceed fixture length"
          result = subprocess.run([
              sys.executable, str(root / "v6_three_view_archive_audit.py"),
              "--csv", str(root / "historical_latest_20.csv"),
              "--expected-first-draw", archive[0]["draw_id"],
              "--expected-last-draw", archive[-1]["draw_id"],
              "--expected-count", str(len(archive)),
              "--output", "v6-three-view-negative-audit.json",
          ], capture_output=True, text=True)
          if result.returncode == 0:
              raise SystemExit("ERROR: incomplete fixture incorrectly passed full-history audit")
          print("PASS: 20-row fixture correctly rejected as full-history archive")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v6-three-view-fixture-audit
          path: v6-three-view-audit.json

      - name: Import existing Power draw CSV into isolated research SQLite
        run: |
          python - <<'PY'
          import csv, hashlib, json, sqlite3
          from pathlib import Path
          source=Path("verification/of_lgbm_data/power_history_archive.csv")
          expected="de92a6019d8efa300f4cbb0e96b7badd9babfea9889b5e7657f0b10a01a80e5b"
          digest=hashlib.sha256(source.read_bytes()).hexdigest()
          assert digest==expected, "Source changed: require fresh review"
          with source.open(encoding="utf-8-sig",newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)>0, "Empty canonical Power archive"
          ids=set()
          db=Path("of-lgbm-power-research.sqlite")
          with sqlite3.connect(db) as conn:
              conn.execute("CREATE TABLE draws (draw_id TEXT PRIMARY KEY, draw_date TEXT, n1 INTEGER NOT NULL, n2 INTEGER NOT NULL, n3 INTEGER NOT NULL, n4 INTEGER NOT NULL, n5 INTEGER NOT NULL, n6 INTEGER NOT NULL, second INTEGER NOT NULL)")
              for row in rows:
                  draw_id=row["draw_id"].strip()
                  assert draw_id not in ids, "Duplicate draw ID"
                  ids.add(draw_id)
                  nums=[int(v) for v in row["first"].replace(","," ").split()]
                  assert len(nums)==6 and len(set(nums))==6 and all(1<=v<=38 for v in nums)
                  second=int(row["second"])
                  assert 1<=second<=8
                  conn.execute("INSERT INTO draws VALUES (?,?,?,?,?,?,?,?,?)",(draw_id,None,*nums,second))
              conn.execute("CREATE TABLE metadata (key TEXT PRIMARY KEY, value TEXT NOT NULL)")
              entries={
                  "source_path":str(source),
                  "source_sha256":digest,
                  "source_row_count":str(len(rows)),
                  "official_source_authenticated":"false",
                  "official_row_by_row_verified":"false",
                  "draw_dates_complete":"false",
                  "use":"research_snapshot_only"}
              conn.executemany("INSERT INTO metadata VALUES (?,?)",entries.items())
              count=conn.execute("SELECT COUNT(*) FROM draws").fetchone()[0]
              assert count==len(rows), "SQLite import count differs from canonical archive"
              assert conn.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          result={"imported_rows":count,"sqlite_sha256":hashlib.sha256(db.read_bytes()).hexdigest(),
              "source_sha256":digest,"source_file":str(source),
              "officially_authenticated":False,"missing_dates":count,
              "database":"of-lgbm-power-research.sqlite"}
          Path("of-lgbm-sqlite-import-report.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: of-lgbm-power-research-sqlite
          path: |
            of-lgbm-power-research.sqlite
            of-lgbm-sqlite-import-report.json
          if-no-files-found: error

      - name: Install OF-LGBM CPU dependencies for SQLite-to-model E2E
        run: python -m pip install --disable-pip-version-check -r verification/of_lgbm_requirements.txt
      - name: SQLite import to real OpenFE and LightGBM holdout, eight-pool exact selection
        run: |
          python - <<'PY'
          import csv, hashlib, json, sqlite3, subprocess, sys
          from pathlib import Path
          source=Path("verification/of_lgbm_data/power_history_archive.csv")
          db=Path("of-lgbm-power-research.sqlite")
          assert db.exists(), "SQLite import missing"
          with sqlite3.connect(db) as conn:
              assert conn.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              rows=conn.execute("SELECT draw_id,n1,n2,n3,n4,n5,n6,second FROM draws ORDER BY rowid").fetchall()
              meta=dict(conn.execute("SELECT key,value FROM metadata").fetchall())
          assert len(rows)==int(meta["source_row_count"]), "SQLite count / metadata mismatch"
          assert meta["source_sha256"]==hashlib.sha256(source.read_bytes()).hexdigest()
          assert meta["official_source_authenticated"]=="false"
          export=Path("of-lgbm-power-sqlite-export.csv")
          with export.open("w",newline="",encoding="utf-8") as out:
              writer=csv.writer(out)
              writer.writerow(["draw_id","first","second"])
              for draw_id,*nums in rows:
                  writer.writerow([draw_id," ".join(map(str,nums[:6])),nums[6]])
          with source.open(newline="",encoding="utf-8-sig") as f:
              canonical=list(csv.DictReader(f))
          with export.open(newline="",encoding="utf-8") as f:
              exported=list(csv.DictReader(f))
          assert len(canonical)==len(exported)
          for original,again in zip(canonical,exported):
              assert original["draw_id"]==again["draw_id"]
              assert tuple(sorted(map(int,original["first"].replace(","," ").split())))==tuple(sorted(map(int,again["first"].split())))
              assert int(original["second"])==int(again["second"])
          subprocess.run([sys.executable,"verification/of_lgbm_forward_audit.py","--game","power","--csv",str(export),"--folds","1","--output","of-lgbm-sqlite-real-e2e.json"],check=True)
          report=json.loads(Path("of-lgbm-sqlite-real-e2e.json").read_text())
          w=report["walk_forward"]
          assert w["folds"]==1 and w["mode"]=="actual OpenFE+LightGBM refit for each held-out draw"
          assert w["feature_window_lengths"]==[10,20]
          assert not w["official_data_verified"] and not w["predictive_advantage_verified"]
          assert len(w["outcomes"][0]["ticket"])==6
          assert len(set(w["outcomes"][0]["ticket"]))==6
          assert 1<=w["outcomes"][0]["second_pick"]<=8
          print("PASS: SQLite -> CSV -> chronological OpenFE+LightGBM -> 8-pool exact selection -> one historical holdout")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: of-lgbm-power-sqlite-model-e2e
          path: |
            of-lgbm-sqlite-real-e2e.json
          if-no-files-found: warn
