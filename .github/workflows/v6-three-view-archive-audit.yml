name: V6 three-view archive audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/v6-semantic-release-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit bundled 20-row fixture (NOT full history)
        run: |
          python WP-OS-Git-MAX/v6_three_view_archive_audit.py --csv WP-OS-Git-MAX/historical_latest_20.csv --expected-first-draw 115000070 --expected-last-draw 115000089 --expected-count 20 --output v6-three-view-audit.json
      - name: Reject false full-history assertion
        run: |
          if python WP-OS-Git-MAX/v6_three_view_archive_audit.py --csv WP-OS-Git-MAX/historical_latest_20.csv --expected-first-draw 115000001 --expected-last-draw 115000089 --expected-count 89; then
            echo 'ERROR: incomplete archive incorrectly passed'; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v6-three-view-fixture-audit
          path: v6-three-view-audit.json
