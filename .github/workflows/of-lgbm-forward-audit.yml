name: OF-LGBM standalone historical audit and one-step ML holdout

on:
  pull_request:
    paths:
      - 'verification/of_lgbm_forward_audit.py'
      - 'verification/test_of_lgbm_forward_audit.py'
      - 'verification/of_lgbm_all_operator_e2e.py'
      - 'verification/of_lgbm_data/**'
      - 'verification/of_lgbm_requirements.txt'
      - '.github/workflows/of-lgbm-forward-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-of-lgbm-historical:
    name: OF-LGBM / historical CSV integrity + true ML forward fit
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OF-LGBM-only CPU requirements
        run: python -m pip install --disable-pip-version-check -r verification/of_lgbm_requirements.txt
      - name: Run causal boundary and data-quality contracts
        run: python -m unittest verification/test_of_lgbm_forward_audit.py -v
      - name: Audit historical Power CSV (not official-source certification)
        run: |
          python verification/of_lgbm_forward_audit.py --game power \
            --csv verification/of_lgbm_data/power_history_archive.csv \
            --folds 0 --output of-lgbm-csv-audit.json > of-lgbm-csv-audit.log
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("of-lgbm-csv-audit.json").read_text())
          a = data["audit"]
          assert a["rows"] >= 17 and a["chronological_and_legal_range_verified"]
          assert not a["independent_official_provenance_verified"]
          assert not a["dates_verified"]
          assert len(a["sha256"]) == 64
          print("PASS: local CSV integrity checks, NOT official-source authentication")
          PY
      - name: Actual OpenFE 23-operator + LightGBM three-view holdout
        run: |
          python verification/of_lgbm_forward_audit.py --game power \
            --csv verification/of_lgbm_data/power_history_archive.csv \
            --folds 1 --output of-lgbm-forward.json > of-lgbm-forward.log
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("of-lgbm-forward.json").read_text())
          b = data["walk_forward"]
          assert b["mode"] == "actual OpenFE+LightGBM refit for each held-out draw"
          assert b["folds"] == 1 and len(b["outcomes"]) == 1
          assert b["outcomes"][0]["target_id"] != b["outcomes"][0]["cutoff_id"]
          assert b["feature_window_lengths"] == [5,10]
          assert b["view_weights"] == {"latest_5":0.35,"latest_10":0.35,"full_archive":0.30}
          assert not b["official_data_verified"] and not b["predictive_advantage_verified"]
          print("PASS: true ML holdout without target draw in training")
          PY
      - name: Upload independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: of-lgbm-forward-evidence
          path: |
            of-lgbm-csv-audit.json
            of-lgbm-csv-audit.log
            of-lgbm-forward.json
            of-lgbm-forward.log
          if-no-files-found: warn
