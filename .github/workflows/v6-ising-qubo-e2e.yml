name: V6 Ising QUBO fused-score integration E2E
on:
  pull_request:
    paths:
      - 'verification/v6_ising_*.py'
      - 'verification/test_v6_ising_*.py'
      - '.github/workflows/v6-ising-qubo-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ising-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install actual CPU ML and CUDA-Q dependencies
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check 'openfe==0.0.12' 'matplotlib>=3.9,<4' cudaq
      - name: Unit tests
        run: python -m unittest discover -s verification -p 'test_v6_ising_*.py' -v
      - name: Run upstream trained fusion with mandatory CUDA-Q
        run: |
          python WP-OS-Git-MAX/v6_ai_exact_e2e.py --csv WP-OS-Git-MAX/historical_archive.csv --openfe-three-views --pytorch-three-views --pytorch-weight 0.5 --require-cudaq --output v6-ising-upstream.json
      - name: Audit real upstream fused scores against Ising and exact search
        run: python verification/v6_ising_fusion_audit.py v6-ising-upstream.json v6-ising-audit.json
      - uses: actions/upload-artifact@v6
        with:
          name: v6-ising-audit-${{ github.run_id }}
          path: |
            v6-ising-upstream.json
            v6-ising-audit.json
          if-no-files-found: error
