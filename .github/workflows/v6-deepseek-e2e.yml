name: V6 DeepSeek adapter offline E2E
on:
  push:
    branches: [main]
    paths:
      - 'WP-OS-Git-MAX/v6_deepseek_adapter.py'
      - 'WP-OS-Git-MAX/test_v6_deepseek_adapter.py'
      - '.github/workflows/v6-deepseek-e2e.yml'
  pull_request:
    paths:
      - 'WP-OS-Git-MAX/v6_deepseek_adapter.py'
      - 'WP-OS-Git-MAX/test_v6_deepseek_adapter.py'
      - '.github/workflows/v6-deepseek-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline DeepSeek adapter integration tests
        run: python -m unittest discover -s WP-OS-Git-MAX -p 'test_v6_deepseek_adapter.py' -v
