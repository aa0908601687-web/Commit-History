name: WP AI Quantum Free Plan Safe Preflight
on:
  push:
    branches:
      - feature/wp-ai-quantum-independent
    paths:
      - 'WP-AI-Quantum/**'
      - '.github/workflows/wp-ai-quantum-free-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  free-safe-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate offline without IBM credentials or hardware submission
        env:
          IBM_QUANTUM_API_TOKEN: ''
          IBM_QUANTUM_INSTANCE: ''
        run: |
          python -m compileall -q WP-AI-Quantum
          python WP-AI-Quantum/workflow_safety_contract.py --free .github/workflows/wp-ai-quantum-free-preflight.yml --hardware .github/workflows/wp-ai-ibm-real-qpu.yml
          python - <<'PY'
          import csv
          from pathlib import Path
          root=Path("WP-OS-Git-MAX")
          def read(name):
              with (root/name).open(encoding="utf-8-sig",newline="") as f:
                  return list(csv.DictReader(f))
          archive=read("historical_archive.csv")
          recent=read("historical_latest_20.csv")
          assert len(recent)==20 and len(archive)>=20
          assert recent==archive[-20:], "Feature window differs from archive tail"
          assert len({r["draw_id"] for r in archive})==len(archive)
          print("CSV window alignment verified through", recent[-1]["draw_id"])
          print("Freshness relative to official lottery data has not been verified")
          PY
          python -m unittest discover -s WP-AI-Quantum -p 'test_*.py' -v
          python WP-AI-Quantum/quantum_e2e_validation.py --csv WP-OS-Git-MAX/historical_latest_20.csv > free_preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('free_preflight.json').read_text())
          assert r['selection_valid'] is True
          assert r['real_qpu_verified'] is False
          assert r['qpu_influenced_selection'] is False
          print('Offline checks passed; this workflow did not invoke QPU submission code')
          PY
      - name: Upload offline-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantum-free-offline-preflight
          path: free_preflight.json
          if-no-files-found: ignore
