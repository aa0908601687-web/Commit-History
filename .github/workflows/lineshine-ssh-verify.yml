name: LineShine SSH verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lineshine-ssh-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify SSH and detect scheduler
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LINESHINE_HOST: ${{ secrets.LINESHINE_HOST }}
      LINESHINE_USER: ${{ secrets.LINESHINE_USER }}
      LINESHINE_SSH_PORT: ${{ secrets.LINESHINE_SSH_PORT }}
      LINESHINE_KNOWN_HOSTS: ${{ secrets.LINESHINE_KNOWN_HOSTS }}
      LINESHINE_SSH_PRIVATE_KEY: ${{ secrets.LINESHINE_SSH_PRIVATE_KEY }}

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in LINESHINE_HOST LINESHINE_USER LINESHINE_SSH_PORT LINESHINE_KNOWN_HOSTS LINESHINE_SSH_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]]
          [[ "$LINESHINE_SSH_PORT" =~ ^[0-9]+$ ]] || {
            echo "::error::LINESHINE_SSH_PORT must be numeric."
            exit 1
          }

      - name: Install SSH credentials
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$LINESHINE_SSH_PRIVATE_KEY" > "$HOME/.ssh/lineshine_key"
          chmod 600 "$HOME/.ssh/lineshine_key"
          printf '%s\n' "$LINESHINE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify connection and detect scheduler
        shell: bash
        run: |
          set -euo pipefail
          scheduler="$(ssh             -i "$HOME/.ssh/lineshine_key"             -p "$LINESHINE_SSH_PORT"             -o BatchMode=yes             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$HOME/.ssh/known_hosts"             -o ConnectTimeout=15             -o LogLevel=ERROR             "$LINESHINE_USER@$LINESHINE_HOST"             'if command -v sbatch >/dev/null 2>&1; then echo Slurm; elif command -v qsub >/dev/null 2>&1; then echo PBS-or-SGE; elif command -v bsub >/dev/null 2>&1; then echo LSF; else echo Unknown; fi')"
          echo "SSH connection: successful"
          echo "Detected scheduler: $scheduler"

      - name: Remove temporary key
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/lineshine_key" "$HOME/.ssh/known_hosts"
