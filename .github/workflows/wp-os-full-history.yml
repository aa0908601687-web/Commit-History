name: WP-OS full official history backfill
on:
  push:
    paths:
      - '.github/workflows/wp-os-full-history.yml'
      - 'WP-OS-Git-MAX/backfill_official_history.py'
      - 'WP-OS-Git-MAX/test_evidence_audit.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wp-os-history-backfill
  cancel-in-progress: false
jobs:
  download-annual:
    name: Download official archive ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 19
      matrix:
        year: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - name: Download one official annual ZIP
        shell: bash
        run: |
          mkdir -p annual-archives
          curl --fail --location --retry 3 --retry-all-errors \
            --user-agent 'Mozilla/5.0' \
            --referer 'https://www.taiwanlottery.com/lotto/history/result_download/' \
            --output "annual-archives/${{ matrix.year }}.zip" \
            "https://cdn.taiwanlottery.com.tw/app/FilesForDownload/Download/LottoResult/${{ matrix.year }}.zip"
          unzip -t "annual-archives/${{ matrix.year }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: official-annual-${{ matrix.year }}
          path: annual-archives/${{ matrix.year }}.zip
          if-no-files-found: error
          retention-days: 1

  backfill:
    needs: download-annual
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect official annual ZIPs
        uses: actions/download-artifact@v4
        with:
          pattern: official-annual-*
          path: annual-archives
          merge-multiple: true
      - name: Retrieve and verify all official SuperLotto638 draws
        shell: bash
        env:
          HISTORY_ARCHIVE_DIR: annual-archives
        run: |
          set +e
          python WP-OS-Git-MAX/backfill_official_history.py 2>&1 | tee full-history-backfill.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            detail=$(tail -n 20 full-history-backfill.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Official history backfill failed::$detail"
            exit "$status"
          fi
      - name: Upload backfill diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-os-full-history-diagnostics
          path: |
            full-history-backfill.log
            WP-OS-Git-MAX/history_backfill_manifest.json
          if-no-files-found: warn
      - name: Verify archive with existing tests and evidence audit
        run: |
          python -m unittest discover -s WP-OS-Git-MAX -p 'test_*.py'
          python WP-OS-Git-MAX/evidence_audit.py --csv WP-OS-Git-MAX/historical_archive.csv --backtest-count 100 --output evidence-report.json > /dev/null
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: wp-os-full-history-evidence
          path: |
            evidence-report.json
            WP-OS-Git-MAX/history_backfill_manifest.json
          if-no-files-found: error
      - name: Commit verified archive only on success
        run: |
          if ! git diff --quiet -- WP-OS-Git-MAX/historical_archive.csv WP-OS-Git-MAX/historical_latest_20.csv WP-OS-Git-MAX/historical_latest_10.csv; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add WP-OS-Git-MAX/historical_archive.csv WP-OS-Git-MAX/historical_latest_20.csv WP-OS-Git-MAX/historical_latest_10.csv WP-OS-Git-MAX/history_backfill_manifest.json
            git commit -m 'Backfill validated official WP-OS draw history'
            git push
          else
            echo 'No verified changes'
          fi
