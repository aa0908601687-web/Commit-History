name: WP-OS full official history backfill
on:
  push:
    paths:
      - '.github/workflows/wp-os-full-history.yml'
      - 'WP-OS-Git-MAX/backfill_official_history.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wp-os-history-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover official annual download interface
        shell: bash
        run: |
          python - <<'PY' | tee official-download-discovery.log
          import re
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          page = "https://www.taiwanlottery.com/lotto/history/result_download/"
          headers = {"User-Agent": "Mozilla/5.0", "Accept": "text/html,application/javascript"}
          def get(url):
              with urlopen(Request(url, headers=headers), timeout=30) as response:
                  return response.read().decode("utf-8", "replace")
          html = get(page)
          assets = {
              urljoin(page, value)
              for value in re.findall(r'''(?:src|href)=["']([^"']+\.js(?:\?[^"']*)?)["']''', html)
          }
          candidates = set()
          patterns = (
              r'''["']([^"']*(?:result[_-]?download|download|export)[^"']*)["']''',
              r'''["']([^"']*TLCAPIWeB[^"']*)["']''',
          )
          for url in sorted(assets):
              try:
                  body = get(url)
              except Exception as exc:
                  print("ASSET_ERROR", url, repr(exc))
                  continue
              for pattern in patterns:
                  for value in re.findall(pattern, body, re.I):
                      if len(value) <= 500:
                          candidates.add(value)
          print("PAGE", page)
          print("ASSETS", len(assets))
          for value in sorted(candidates):
              print("CANDIDATE", value)
          print("CANDIDATE_COUNT", len(candidates))
          if candidates:
              summary = " | ".join(sorted(candidates))[:7000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title=Official annual download candidates::{summary}")
          else:
              print("::warning title=Official annual download discovery::No candidate endpoint found")
          PY
      - name: Retrieve and verify all official SuperLotto638 months
        shell: bash
        run: |
          set +e
          python WP-OS-Git-MAX/backfill_official_history.py 2>&1 | tee full-history-backfill.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            detail=$(tail -n 20 full-history-backfill.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Official history backfill failed::$detail"
            exit "$status"
          fi
      - name: Upload backfill diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-os-full-history-diagnostics
          path: |
            official-download-discovery.log
            full-history-backfill.log
            WP-OS-Git-MAX/history_backfill_manifest.json
          if-no-files-found: warn
      - name: Verify archive with existing tests and evidence audit
        run: |
          python -m unittest discover -s WP-OS-Git-MAX -p 'test_*.py'
          python WP-OS-Git-MAX/evidence_audit.py --csv WP-OS-Git-MAX/historical_archive.csv --backtest-count 100 --output evidence-report.json > /dev/null
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: wp-os-full-history-evidence
          path: |
            evidence-report.json
            WP-OS-Git-MAX/history_backfill_manifest.json
          if-no-files-found: error
      - name: Commit verified archive only on success
        run: |
          if ! git diff --quiet -- WP-OS-Git-MAX/historical_archive.csv WP-OS-Git-MAX/historical_latest_20.csv WP-OS-Git-MAX/historical_latest_10.csv; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add WP-OS-Git-MAX/historical_archive.csv WP-OS-Git-MAX/historical_latest_20.csv WP-OS-Git-MAX/historical_latest_10.csv WP-OS-Git-MAX/history_backfill_manifest.json
            git commit -m 'Backfill validated official WP-OS draw history'
            git push
          else
            echo 'No verified changes'
          fi
