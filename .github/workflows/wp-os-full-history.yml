name: WP-OS full official history backfill
on:
  push:
    paths:
      - '.github/workflows/wp-os-full-history.yml'
      - 'WP-OS-Git-MAX/backfill_official_history.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wp-os-history-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect official 2008 ZIP schema
        shell: bash
        run: |
          python - <<'PY' | tee official-download-discovery.log
          import io, zipfile
          from urllib.request import Request, urlopen
          url = "https://cdn.taiwanlottery.com.tw/app/FilesForDownload/Download/LottoResult/2008.zip"
          with urlopen(Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=60) as response:
              payload = response.read()
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              print("FILES", archive.namelist())
              chunks = []
              for name in archive.namelist():
                  if name.endswith("/"):
                      continue
                  raw = archive.read(name)
                  decoded = None
                  encoding = None
                  for candidate in ("utf-8-sig", "cp950", "big5", "utf-16"):
                      try:
                          decoded = raw.decode(candidate)
                          encoding = candidate
                          break
                      except UnicodeDecodeError:
                          pass
                  preview = (decoded or repr(raw[:500]))[:6000]
                  item = f"FILE={name} ENCODING={encoding}\n{preview}"
                  print(item)
                  chunks.append(item)
              summary = "\n---\n".join(chunks)[:7000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title=Official 2008 ZIP schema::{summary}")
          PY
      - name: Retrieve and verify all official SuperLotto638 months
        shell: bash
        run: |
          set +e
          python WP-OS-Git-MAX/backfill_official_history.py 2>&1 | tee full-history-backfill.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            detail=$(tail -n 20 full-history-backfill.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Official history backfill failed::$detail"
            exit "$status"
          fi
      - name: Upload backfill diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-os-full-history-diagnostics
          path: |
            official-download-discovery.log
            full-history-backfill.log
            WP-OS-Git-MAX/history_backfill_manifest.json
          if-no-files-found: warn
      - name: Verify archive with existing tests and evidence audit
        run: |
          python -m unittest discover -s WP-OS-Git-MAX -p 'test_*.py'
          python WP-OS-Git-MAX/evidence_audit.py --csv WP-OS-Git-MAX/historical_archive.csv --backtest-count 100 --output evidence-report.json > /dev/null
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: wp-os-full-history-evidence
          path: |
            evidence-report.json
            WP-OS-Git-MAX/history_backfill_manifest.json
          if-no-files-found: error
      - name: Commit verified archive only on success
        run: |
          if ! git diff --quiet -- WP-OS-Git-MAX/historical_archive.csv WP-OS-Git-MAX/historical_latest_20.csv WP-OS-Git-MAX/historical_latest_10.csv; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add WP-OS-Git-MAX/historical_archive.csv WP-OS-Git-MAX/historical_latest_20.csv WP-OS-Git-MAX/historical_latest_10.csv WP-OS-Git-MAX/history_backfill_manifest.json
            git commit -m 'Backfill validated official WP-OS draw history'
            git push
          else
            echo 'No verified changes'
          fi
