name: V6 OF3Q dependency and reference verification
on:
  push:
    branches:
      - feature/v6-of3q-rocq-verification-20261105
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run reference unit tests
        run: python -m unittest discover -s verification/tests -p 'test_*.py' -v
  ml-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenFE and LightGBM
        run: python -m pip install --upgrade pip && python -m pip install openfe lightgbm matplotlib
      - name: Smoke-test imports
        run: python -c "import openfe, lightgbm; print('OpenFE import OK; LightGBM', lightgbm.__version__)"
  cudaq-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CUDA-Q Python package
        run: python -m pip install --upgrade pip && python -m pip install cudaq
      - name: Smoke-test CUDA-Q
        run: |
          python - <<'PY'
          import cudaq
          print('CUDA-Q import OK')
          kernel = cudaq.make_kernel()
          q = kernel.qalloc(1)
          kernel.h(q[0])
          kernel.mz(q[0])
          result = cudaq.sample(kernel, shots_count=100)
          print(result)
          PY
  rocq-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install opam prerequisites
        run: sudo apt-get update && sudo apt-get install -y opam build-essential m4 pkg-config libgmp-dev
      - name: Initialize opam and OCaml switch
        timeout-minutes: 25
        run: |
          set -euxo pipefail
          opam init --disable-sandboxing -y --bare
          opam switch create v6-rocq ocaml-base-compiler.5.2.1 -y
          opam exec --switch=v6-rocq -- ocamlc -version
      - name: Install Rocq prover
        timeout-minutes: 30
        run: |
          set -euxo pipefail
          opam install --switch=v6-rocq -y rocq-prover
      - name: Verify Rocq installation
        timeout-minutes: 3
        run: |
          set -euxo pipefail
          opam exec --switch=v6-rocq -- rocq --version
          opam exec --switch=v6-rocq -- rocq compile -help
      - name: Compile Rocq candidate proof
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          opam exec --switch=v6-rocq -- rocq compile verification/rocq/V6Candidate.v
