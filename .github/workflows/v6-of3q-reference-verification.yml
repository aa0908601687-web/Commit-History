name: V6 OF3Q reference verification
on:
  push:
    branches:
      - feature/v6-of3q-rocq-verification-20261105
  pull_request:
  workflow_dispatch:
jobs:
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run 8-of-6 reference unit tests
        run: python -m unittest discover -s verification/tests -p 'test_*.py' -v
