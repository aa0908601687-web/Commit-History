name: V6 OF3Q OpenFE LightGBM exact-search verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-cpu-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenFE and LightGBM
        run: python -m pip install 'openfe==0.0.12' 'lightgbm>=4.3,<5' 'matplotlib>=3.9,<4'
      - name: Run Python exact-selection contracts
        run: python -m unittest discover -v -s WP-OS-Git-MAX -p 'test_v6_exact_search.py'
      - name: Run OpenFE integration contracts
        run: python -m unittest discover -v -s WP-OS-Git-MAX -p 'test_v6_openfe_integration.py'
      - name: Run OpenFE LightGBM full-history E2E
        run: |
          python WP-OS-Git-MAX/v6_exact_e2e.py --csv WP-OS-Git-MAX/historical_archive.csv --openfe-three-views --output v6-core.json
          python - <<'PY'
          import json
          d=json.load(open('v6-core.json'))
          assert len(d['candidate_pool'])==8
          assert len(d['first_zone'])==6
          assert d['exact_optimization_layer']['searched_combinations']==28
          assert d['openfe_feature_layer']['enabled']
          assert len(d['sha256'])==64
          print('PASS: OpenFE LightGBM exact selection')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-core-${{ github.run_id }}
          path: v6-core.json
          if-no-files-found: warn
