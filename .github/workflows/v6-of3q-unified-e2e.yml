name: V6 OF3Q unified offline end-to-end verification
on:
  pull_request:
    paths:
      - 'WP-OS-Git-MAX/v6_*.py'
      - 'WP-OS-Git-MAX/test_v6_*.py'
      - 'verification/v6_*.py'
      - 'verification/rocq/**'
      - '.github/scripts/v6_nemotron_vision_client.py'
      - '.github/scripts/test_v6_nemotron_vision_client.py'
      - '.github/workflows/v6-of3q-unified-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'WP-OS-Git-MAX/v6_*.py'
      - 'WP-OS-Git-MAX/test_v6_*.py'
      - 'verification/v6_*.py'
      - 'verification/rocq/**'
      - '.github/scripts/v6_nemotron_vision_client.py'
      - '.github/scripts/test_v6_nemotron_vision_client.py'
      - '.github/workflows/v6-of3q-unified-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-cpu-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU AI and CUDA-Q tools
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check 'openfe==0.0.12' 'matplotlib>=3.9,<4' 'cudaq==0.16.0'
      - name: Verify relevant offline module contracts
        run: |
          python -m unittest discover -v -s WP-OS-Git-MAX -p 'test_v6_ising_pipeline.py'
          python -m unittest discover -v -s WP-OS-Git-MAX -p 'test_v6_nemotron_ingest.py'
          python -m unittest discover -v -s WP-OS-Git-MAX -p 'test_v6_pytorch_fusion.py'
          python -m unittest discover -v -s verification -p 'test_v6_ising_*.py'
          python -m unittest discover -v -s .github/scripts -p 'test_v6_nemotron_vision_client.py'
      - name: Run one combined OpenFE LightGBM PyTorch CUDA-Q Ising and exact-search invocation
        run: |
          python WP-OS-Git-MAX/v6_ai_exact_e2e.py \
            --csv WP-OS-Git-MAX/historical_archive.csv \
            --openfe-three-views --pytorch-three-views --pytorch-weight 0.5 \
            --require-cudaq --ising-qubo-check \
            --output v6-unified-core.json
      - name: Assert true backend execution and final selection
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          d=json.loads(Path('v6-unified-core.json').read_text())
          f=d['openfe_feature_layer']
          c=d['cudaq_layer']
          i=d['ising_qubo_layer']
          e=d['exact_optimization_layer']
          assert f['engine']=='OpenFE+LightGBM+PyTorch'
          assert f['pytorch_layer']['trained'] is True
          assert f['fusion_weights']=={'lightgbm':0.5,'pytorch':0.5}
          scores={int(n):float(s) for n,s in f['fused_scores'].items()}
          assert set(scores)==set(range(1,39))
          assert all(math.isfinite(s) and 0<=s<=1 for s in scores.values())
          pool=sorted(scores,key=lambda n:(-scores[n],n))[:8]
          assert pool==d['candidate_pool'] and len(set(pool))==8
          assert c['executed'] is True and c['backend']=='qpp-cpu' and c['qpu'] is False
          assert i['executed'] and i['same_optimal_score'] and i['combinations_checked']==28
          assert i['nvidia_native_solver_executed'] is False
          assert i['rocq_runtime_proof'] is False
          assert e['searched_combinations']==28
          assert d['first_zone']==e['exact_selection']
          assert math.isclose(sum(scores[n] for n in d['first_zone']),e['exact_score'],abs_tol=1e-8)
          assert len(d['first_zone'])==len(set(d['first_zone']))==6
          assert all(1<=n<=38 for n in d['first_zone']) and 1<=d['second_zone']<=8
          print('PASS: real CPU AI fusion, CUDA-Q local, QUBO CPU, exact optimality and legal ticket')
          PY
      - name: Upload core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-unified-core-${{ github.run_id }}
          path: v6-unified-core.json
          if-no-files-found: warn
  nemotron-offline-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Nemotron audit adapter and mock vision client
        run: |
          python -m unittest discover -v -s WP-OS-Git-MAX -p 'test_v6_nemotron_ingest.py'
          python -m unittest discover -v -s .github/scripts -p 'test_v6_nemotron_vision_client.py'
      - name: Check canonical CSV match and reject fake live-inference claims
        run: |
          python - <<'PY'
          import csv,json,sys
          from pathlib import Path
          sys.path.insert(0,'WP-OS-Git-MAX')
          from v6_nemotron_ingest import audit_extraction
          csv_path='WP-OS-Git-MAX/historical_archive.csv'
          with open(csv_path,encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))[-10:]
          assert len(rows)==10
          obj={'source':'offline-fixture-no-nvidia-inference','draws':[{'draw_id':r['draw_id'],'first':[int(n) for n in r['first'].split()],'second':int(r['second'])} for r in rows]}
          Path('v6-unified-extraction.json').write_text(json.dumps(obj))
          result=audit_extraction(csv_path,'v6-unified-extraction.json')
          assert result['status']=='matched_canonical_csv'
          assert result['checked_draws']==10
          assert result['nemotron_model_executed'] is False
          print('PASS: Nemotron structured input audited, NVIDIA model NOT invoked')
          PY
  rocq-candidate-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Compile Rocq candidate invariants
        run: |
          set -euo pipefail
          docker pull rocq/rocq-prover:9.2
          mkdir -p "$RUNNER_TEMP/v6-rocq-proof"
          cp verification/rocq/V6Candidate.v "$RUNNER_TEMP/v6-rocq-proof/V6Candidate.v"
          chmod 0777 "$RUNNER_TEMP/v6-rocq-proof"
          docker run --rm --entrypoint /bin/sh \
            -v "$RUNNER_TEMP/v6-rocq-proof:/proof" -w /proof \
            rocq/rocq-prover:9.2 -c \
            'opam exec -- rocq --version && opam exec -- rocq compile V6Candidate.v'
          test -s "$RUNNER_TEMP/v6-rocq-proof/V6Candidate.vo"
          echo 'PASS: Rocq candidate invariants compiled (not a Python numeric proof)'
