name: WP-OS Git MAX data and checks
on:
  push:
    paths:
      - 'WP-OS-Git-MAX/**'
      - '.github/workflows/wp-os-git-max.yml'
  pull_request:
    paths:
      - 'WP-OS-Git-MAX/**'
      - '.github/workflows/wp-os-git-max.yml'
  workflow_dispatch:
  schedule:
    # Taiwan time Monday and Thursday at 22:00 (UTC+8).
    - cron: '0 14 * * 1,4'

permissions:
  contents: write

concurrency:
  group: wp-os-git-max-main
  cancel-in-progress: false

jobs:
  update-test-and-sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Restore Scion-style regional cache layer
        id: v3-cache
        uses: actions/cache@v5
        with:
          path: .cache/wp-os-v3
          key: wp-os-v3-${{ runner.os }}-${{ hashFiles('WP-OS-Git-MAX/historical_latest_20.csv', 'WP-OS-Git-MAX/cache_and_hit_validation.py', 'WP-OS-Git-MAX/three_layer_cache_v3.py', 'WP-OS-Git-MAX/research_cache_v3.py', 'WP-OS-Git-MAX/wp_os_git_max.py', 'WP-OS-Git-MAX/wp_os_git_max_10_20.py', 'WP-OS-Git-MAX/wp_os_git_max_fusion.py') }}
          restore-keys: |
            wp-os-v3-${{ runner.os }}-
      - name: Prepare node cache layer
        run: mkdir -p .cache/wp-os-v3
      - name: Refresh official data (scheduled or manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python WP-OS-Git-MAX/update_official_data.py
      - name: Run unit tests
        run: python -m unittest discover -s WP-OS-Git-MAX -p 'test_*.py'
      - name: Verify loaded draw data and generate prediction
        run: |
          python WP-OS-Git-MAX/wp_os_git_max.py --csv WP-OS-Git-MAX/historical_latest_10.csv > /tmp/wp-os-prediction.json
          python -m json.tool /tmp/wp-os-prediction.json > /dev/null
      - name: Generate independent 10/20-draw control comparison
        run: |
          python WP-OS-Git-MAX/wp_os_git_max_10_20.py --csv WP-OS-Git-MAX/historical_latest_20.csv > /tmp/wp-os-control-10-20.json
          python WP-OS-Git-MAX/wp_os_git_max_10_20.py --csv WP-OS-Git-MAX/historical_archive.csv --backtest > /tmp/wp-os-control-10-20-backtest.json
          python - <<'PY'
          import json
          from pathlib import Path
          main=json.loads(Path('/tmp/wp-os-prediction.json').read_text())
          control=json.loads(Path('/tmp/wp-os-control-10-20.json').read_text())
          if main['through_draw'] != control['through_draw']:
              raise ValueError('Main/control data cutoff mismatch')
          a, b=set(main['first']), set(control['first'])
          report={
              'through_draw': main['through_draw'],
              'main_window':[5,10], 'control_window':[10,20],
              'main_first':main['first'], 'main_second':main['second'],
              'control_first':control['first'], 'control_second':control['second'],
              'first_overlap':sorted(a & b), 'first_overlap_count':len(a & b),
              'second_same':main['second']==control['second'],
              'note':'Descriptive control comparison; no predictive advantage claim'
          }
          Path('/tmp/wp-os-main-vs-control.json').write_text(
              json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2)+'\n')
          PY
      - name: Generate equal-weight 5/10 and 10/20 fusion
        run: |
          python WP-OS-Git-MAX/wp_os_git_max_fusion.py --csv WP-OS-Git-MAX/historical_latest_20.csv > /tmp/wp-os-fusion.json
          python WP-OS-Git-MAX/wp_os_git_max_fusion.py --csv WP-OS-Git-MAX/historical_archive.csv --backtest > /tmp/wp-os-fusion-backtest.json
          python -m json.tool /tmp/wp-os-fusion.json > /dev/null
          python -m json.tool /tmp/wp-os-fusion-backtest.json > /dev/null
      - name: Upload equal-weight fusion output
        uses: actions/upload-artifact@v6
        with:
          name: wp-os-fusion-5-10-20-${{ github.run_id }}
          path: |
            /tmp/wp-os-fusion.json
            /tmp/wp-os-fusion-backtest.json
          if-no-files-found: error
          retention-days: 30
      - name: Generate validated 5/10-draw feature cache
        run: |
          python WP-OS-Git-MAX/cache_and_hit_validation.py --csv WP-OS-Git-MAX/historical_latest_10.csv --feature-cache .cache/wp-os-v3/wp-os-feature-cache.json > /dev/null
          python -m json.tool .cache/wp-os-v3/wp-os-feature-cache.json > /dev/null
      - name: V3 result cache and cached/direct consistency checks
        run: |
          python WP-OS-Git-MAX/three_layer_cache_v3.py --csv WP-OS-Git-MAX/historical_latest_20.csv --feature-cache .cache/wp-os-v3/wp-os-feature-cache.json --prediction-cache .cache/wp-os-v3/wp-os-v3-prediction-cache.json --verify > /tmp/wp-os-v3-run-1.json
          python WP-OS-Git-MAX/three_layer_cache_v3.py --csv WP-OS-Git-MAX/historical_latest_20.csv --feature-cache .cache/wp-os-v3/wp-os-feature-cache.json --prediction-cache .cache/wp-os-v3/wp-os-v3-prediction-cache.json --verify > /tmp/wp-os-v3-run-2.json
          python - <<'PY'
          import json
          from pathlib import Path
          first=json.loads(Path('/tmp/wp-os-v3-run-1.json').read_text())
          second=json.loads(Path('/tmp/wp-os-v3-run-2.json').read_text())
          assert second["feature_cache"] == second["prediction_cache"] == "hit"
          assert first["prediction"] == second["prediction"]
          assert second["consistency_verified"]
          print("V3 repeated-run hit, result integrity and parity: passed")
          PY
      - name: V3 control and fusion result caches
        run: |
          python WP-OS-Git-MAX/research_cache_v3.py --csv WP-OS-Git-MAX/historical_latest_20.csv --control-cache .cache/wp-os-v3/wp-os-control-cache.json --fusion-cache .cache/wp-os-v3/wp-os-fusion-cache.json --verify > /tmp/wp-os-v3-research-run-1.json
          python WP-OS-Git-MAX/research_cache_v3.py --csv WP-OS-Git-MAX/historical_latest_20.csv --control-cache .cache/wp-os-v3/wp-os-control-cache.json --fusion-cache .cache/wp-os-v3/wp-os-fusion-cache.json --verify > /tmp/wp-os-v3-research-run-2.json
          python - <<'PY'
          import json
          from pathlib import Path
          first=json.loads(Path('/tmp/wp-os-v3-research-run-1.json').read_text())
          second=json.loads(Path('/tmp/wp-os-v3-research-run-2.json').read_text())
          assert second['models']['control_10_20']['cache'] == 'hit'
          assert second['models']['fusion_5_10_20']['cache'] == 'hit'
          assert first['models']['control_10_20']['prediction'] == second['models']['control_10_20']['prediction']
          assert first['models']['fusion_5_10_20']['prediction'] == second['models']['fusion_5_10_20']['prediction']
          assert second['consistency_verified']
          print('V3 control/fusion repeated-run cache hits and direct parity: passed')
          PY
      - name: Record three-layer cache status
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          run = json.loads(Path('/tmp/wp-os-v3-run-2.json').read_text())
          source = Path('WP-OS-Git-MAX/historical_latest_20.csv').read_bytes()
          status = {
              'architecture': 'Scion-style (not Anthropic Scion)',
              'schema_version': 3,
              'layers': {
                  'node': '.cache/wp-os-v3',
                  'regional': 'GitHub Actions cache',
                  'authoritative': 'repository CSV and source'
              },
              'actions_cache_restored': '${{ steps.v3-cache.outputs.cache-hit }}' == 'true',
              'source_sha256': hashlib.sha256(source).hexdigest(),
              'feature_cache': run['feature_cache'],
              'prediction_cache': run['prediction_cache'],
              'consistency_verified': run['consistency_verified']
          }
          Path('/tmp/wp-os-v3-cache-status.json').write_text(
              json.dumps(status, ensure_ascii=False, sort_keys=True, indent=2) + '\n')
          PY
      - name: Upload V3 verified result cache
        uses: actions/upload-artifact@v6
        with:
          name: wp-os-v3-result-cache-${{ github.run_id }}
          path: |
            /tmp/wp-os-v3-prediction-cache.json
            /tmp/wp-os-v3-run-2.json
            /tmp/wp-os-v3-cache-status.json
            /tmp/wp-os-v3-research-run-2.json
            .cache/wp-os-v3/wp-os-control-cache.json
            .cache/wp-os-v3/wp-os-fusion-cache.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload analysis cache artifact
        uses: actions/upload-artifact@v6
        with:
          name: wp-os-feature-cache-${{ github.run_id }}
          path: .cache/wp-os-v3/wp-os-feature-cache.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload prediction research artifact
        uses: actions/upload-artifact@v6
        with:
          name: wp-os-prediction-${{ github.run_id }}
          path: /tmp/wp-os-prediction.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload independent 10/20 control comparison
        uses: actions/upload-artifact@v6
        with:
          name: wp-os-control-10-20-${{ github.run_id }}
          path: |
            /tmp/wp-os-control-10-20.json
            /tmp/wp-os-control-10-20-backtest.json
            /tmp/wp-os-main-vs-control.json
          if-no-files-found: error
          retention-days: 30
      - name: V3 end-to-end cache and selection parity
        run: |
          python WP-OS-Git-MAX/cache_v3_pipeline.py --csv WP-OS-Git-MAX/historical_latest_10.csv --cache /tmp/wp-os-cache-v3.json --prediction /tmp/wp-os-prediction-v3.json > /tmp/wp-os-v3-status.json
          python WP-OS-Git-MAX/cache_v3_pipeline.py --csv WP-OS-Git-MAX/historical_latest_10.csv --cache /tmp/wp-os-cache-v3.json > /tmp/wp-os-v3-reuse.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/wp-os-v3-status.json',encoding='utf-8'))
          b=json.load(open('/tmp/wp-os-v3-reuse.json',encoding='utf-8'))
          assert a['cache_status']=='refreshed' and b['cache_status']=='hit'
          assert a['prediction']==b['prediction']
          PY
      - name: V3 research snapshot for next sequential draw
        run: |
          python - <<'PY'
          import csv, subprocess, sys
          p='WP-OS-Git-MAX/historical_latest_10.csv'
          with open(p,encoding='utf-8-sig',newline='') as fp:
              rows=list(csv.DictReader(fp))
          target=str(int(rows[-1]['draw_id'])+1)
          subprocess.run([sys.executable,'WP-OS-Git-MAX/cache_v3_pipeline.py',
              '--csv',p,'--cache','/tmp/wp-os-cache-v3.json',
              '--snapshot','/tmp/wp-os-v3-snapshot.json','--target-draw',target],check=True)
          print('Snapshot requires external timestamp verification before pre-draw claims:',target)
          PY
      - name: Upload V3 verified cache and prediction
        uses: actions/upload-artifact@v6
        with:
          name: wp-os-v3-${{ github.run_id }}
          path: |
            /tmp/wp-os-cache-v3.json
            /tmp/wp-os-prediction-v3.json
            /tmp/wp-os-v3-status.json
            /tmp/wp-os-v3-reuse.json
            /tmp/wp-os-v3-snapshot.json
          if-no-files-found: error
          retention-days: 30
      - name: Historical backtest when more than ten draws exist
        run: |
          python - <<'PY'
          import csv, subprocess, sys
          p = 'WP-OS-Git-MAX/historical_archive.csv'
          with open(p, encoding='utf-8-sig', newline='') as f:
              n = sum(1 for _ in csv.DictReader(f))
          if n > 10:
              import tempfile
              # Fix evaluation to the most recent 15 target draws, with 10 prior draws.
              with open(p, encoding='utf-8-sig', newline='') as fp:
                  reader = csv.DictReader(fp)
                  history = list(reader)[-25:]
                  fieldnames = reader.fieldnames
              with tempfile.NamedTemporaryFile(mode='w', suffix='.csv', newline='', encoding='utf-8', delete=False) as tmp:
                  writer = csv.DictWriter(tmp, fieldnames=fieldnames)
                  writer.writeheader()
                  writer.writerows(history)
                  recent = tmp.name
              try:
                  print(f'Backtest targets: {max(0, len(history)-10)} (maximum 15); features use previous 5/10 draws')
                  subprocess.run([sys.executable, 'WP-OS-Git-MAX/wp_os_git_max.py', '--csv', recent, '--backtest'], check=True)
              finally:
                  import os
                  os.unlink(recent)
          else:
              print(f'Skipped: only {n} historical draws; 11+ required for backtest')
          PY
      - name: Show data and workflow diagnostics
        if: always()
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"
          if [ -f WP-OS-Git-MAX/historical_latest_20.csv ]; then
            echo "Latest saved draw:"
            tail -n 1 WP-OS-Git-MAX/historical_latest_20.csv
            echo "Saved draw count:"
            python -c "import csv; print(sum(1 for _ in csv.DictReader(open('WP-OS-Git-MAX/historical_latest_20.csv', encoding='utf-8-sig'))))"
          fi
      - name: Commit verified changed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- WP-OS-Git-MAX/historical_latest_20.csv WP-OS-Git-MAX/historical_latest_10.csv WP-OS-Git-MAX/historical_archive.csv; then
            echo 'No updated draw data; no commit needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add WP-OS-Git-MAX/historical_latest_20.csv WP-OS-Git-MAX/historical_latest_10.csv WP-OS-Git-MAX/historical_archive.csv
            git commit -m 'Update verified WP-OS lottery historical data'
            git push
          fi
