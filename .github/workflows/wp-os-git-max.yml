name: WP-OS Git MAX checks
on:
  push:
    paths:
      - 'WP-OS-Git-MAX/**'
      - '.github/workflows/wp-os-git-max.yml'
  workflow_dispatch:
  schedule:
    # 22:00 Taiwan time (UTC+8), Monday and Thursday.
    - cron: '0 14 * * 1,4'

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s WP-OS-Git-MAX -p 'test_*.py'
      - name: Validate checked-in lottery CSV and generate research output
        run: |
          python WP-OS-Git-MAX/wp_os_git_max.py --csv WP-OS-Git-MAX/historical_latest_10.csv > /tmp/wp-os-research-output.json
          python -m json.tool /tmp/wp-os-research-output.json > /dev/null
      - name: Run historical backtest only if enough draws exist
        run: |
          python - <<'PY'
          import csv, subprocess, sys
          p = 'WP-OS-Git-MAX/historical_latest_10.csv'
          with open(p, encoding='utf-8-sig', newline='') as f:
              n = sum(1 for _ in csv.DictReader(f))
          if n > 10:
              subprocess.run([sys.executable, 'WP-OS-Git-MAX/wp_os_git_max.py', '--csv', p, '--backtest'], check=True)
          else:
              print(f'Skipping out-of-sample backtest: {n} historical draws; at least 11 are needed.')
          PY
      - name: Explain data-update status
        run: |
          echo 'This workflow validates stored data and runs existing research code.'
          echo 'It does NOT fetch official draw results or push automated updates.'
          echo 'Official-data ingestion must be built and source-validated separately.'
