name: V6 Nemotron real inference verification

on:
  pull_request:
    paths:
      - 'WP-OS-Git-MAX/v6_nemotron_live_probe.py'
      - 'WP-OS-Git-MAX/test_v6_nemotron_live_probe.py'
      - '.github/workflows/v6-nemotron-live-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify probe contract without network
        run: python -m unittest discover -s WP-OS-Git-MAX -p 'test_v6_nemotron_live_probe.py' -v

  live-nemotron:
    runs-on: ubuntu-latest
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Report secret readiness without revealing it
        id: readiness
        shell: bash
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Nemotron live inference UNVERIFIED: NVIDIA_API_KEY GitHub secret is missing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Call NVIDIA Nemotron real inference API
        if: steps.readiness.outputs.configured == 'true'
        run: python WP-OS-Git-MAX/v6_nemotron_live_probe.py
      - name: Fail closed if live inference was not executed
        if: steps.readiness.outputs.configured != 'true'
        run: |
          echo "No live Nemotron verification occurred. Configure NVIDIA_API_KEY to enable this gate."
          exit 1
